          path: "M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12",
        },
        gitlab: {
          label: "GitLab",
          colorClass: "text-[#FC6D26]",
          path: "m23.6004 9.5927-.0337-.0862L20.3.9814a.851.851 0 0 0-.3362-.405.8748.8748 0 0 0-.9997.0539.8748.8748 0 0 0-.29.4399l-2.2055 6.748H7.5375l-2.2057-6.748a.8573.8573 0 0 0-.29-.4412.8748.8748 0 0 0-.9997-.0537.8585.8585 0 0 0-.3362.4049L.4332 9.5015l-.0325.0862a6.0657 6.0657 0 0 0 2.0119 7.0105l.0113.0087.03.0213 4.976 3.7264 2.462 1.8633 1.4995 1.1321a1.0085 1.0085 0 0 0 1.2197 0l1.4995-1.1321 2.4619-1.8633 5.006-3.7489.0125-.01a6.0682 6.0682 0 0 0 2.0094-7.003z",
        },
        gitea: {
          label: "Gitea",
          colorClass: "text-[#609926]",

        },
        forgejo: {
          label: "Forgejo",
          colorClass: "text-[#FB923C]",
          path: "M16.7773 0c1.6018 0 2.9004 1.2986 2.9004 2.9005s-1.2986 2.9004-2.9004 2.9004c-1.0854 0-2.0315-.596-2.5288-1.4787H12.91c-2.3322 0-4.2272 1.8718-4.2649 4.195l-.0007 2.1175a7.0759 7.0759 0 0 1 4.148-1.4205l.1176-.001 1.3385.0002c.4973-.8827 1.4434-1.4788 2.5288-1.4788 1.6018 0 2.9004 1.2986 2.9004 2.9005s-1.2986 2.9004-2.9004 2.9004c-1.0854 0-2.0315-.596-2.5288-1.4787H12.91c-2.3322 0-4.2272 1.8718-4.2649 4.195l-.0007 2.319c.8827.4973 1.4788 1.4434 1.4788 2.5287 0 1.602-1.2986 2.9005-2.9005 2.9005-1.6018 0-2.9004-1.2986-2.9004-2.9005 0-1.0853.596-2.0314 1.4788-2.5287l-.0002-9.9831c0-3.887 3.1195-7.0453 6.9915-7.108l.1176-.001h1.3385C14.7458.5962 15.692 0 16.7773 0ZM7.2227 19.9052c-.6596 0-1.1943.5347-1.1943 1.1943s.5347 1.1943 1.1943 1.1943 1.1944-.5347 1.1944-1.1943-.5348-1.1943-1.1944-1.1943Zm9.5546-10.4644c-.6596 0-1.1944.5347-1.1944 1.1943s.5348 1.1943 1.1944 1.1943c.6596 0 1.1943-.5347 1.1943-1.1943s-.5347-1.1943-1.1943-1.1943Zm0-7.7346c-.6596 0-1.1944.5347-1.1944 1.1943s.5348 1.1943 1.1944 1.1943c.6596 0 1.1943-.5347 1.1943-1.1943s-.5347-1.1943-1.1943-1.1943Z",

        bitbucket: {

          path: "M.778 1.213a.768.768 0 00-.768.892l3.263 19.81c.084.5.515.868 1.022.873H19.95a.772.772 0 00.77-.646l3.27-20.03a.768.768 0 00-.768-.891zM14.52 15.53H9.522L8.17 8.466h7.561z",
        },
      };

      // Bitbucket Data Center shares Bitbucket's mark; only the label differs,
      // so the tooltip is what tells the two apart.
      PROVIDER_LOGOS["bitbucket-server"] = {
        ...PROVIDER_LOGOS.bitbucket,
        label: "Bitbucket Server",
      };

      // provider.name reaches the UI verbatim from the CRD, so tolerate casing
      // and separator variants of the platform values Renovate documents.
      const PROVIDER_ALIASES = {
        bitbucketserver: "bitbucket-server",
        bitbucket_server: "bitbucket-server",
        "bitbucket-datacenter": "bitbucket-server",
      };

      function ProviderLogo({ platform }) {
        const raw = typeof platform === "string" ? platform.trim() : "";
        if (!raw) {
          return null;
        }
        const key = raw.toLowerCase();
        const logo = PROVIDER_LOGOS[PROVIDER_ALIASES[key] || key];

        // Platforms we ship no mark for (azure, gerrit, codecommit, local, or
        // anything Renovate adds later) get a monogram instead of a blank.
        if (!logo) {
          return (
            <span
              className="w-4 h-4 flex-shrink-0 inline-flex items-center justify-center rounded-sm bg-gray-200 dark:bg-slate-700 text-gray-600 dark:text-slate-300 text-[0.625rem] font-bold leading-none uppercase"
              role="img"
              aria-label={raw}
              title={raw}
            >
              {raw.charAt(0)}
            </span>
          );
        }

        return (
          <svg
            className={`w-4 h-4 flex-shrink-0 ${logo.colorClass || ""}`}
            viewBox="0 0 24 24"
            fill="currentColor"
            role="img"
            aria-label={logo.label}
            xmlns="http://www.w3.org/2000/svg"
          >
            <title>{logo.label}</title>
            <path d={logo.path} />
          </svg>
        );
      }

      const getBadgeClass = (status) => {
        const base =
          "inline-flex items-center rounded-full px-3 py-1 text-sm font-medium whitespace-nowrap";
        switch (status) {
          case "scheduled":
            return `${base} bg-warning/10 text-warning`;
          case "running":
            return `${base} bg-primary/10 text-primary`;
          case "completed":
            return `${base} bg-success/10 text-success`;
          case "failed":
            return `${base} bg-error/10 text-error`;
          case "cancelled":
            return `${base} bg-gray-200 text-gray-600 dark:bg-slate-700 dark:text-slate-300`;
          default:
            return `${base} bg-primary/10 text-primary`;
        }
      };

      // A running project spins in its own status cell, so a long run reads as
      // work in flight instead of a row stuck on "running". Every other state
      // is static, so the badge stays a plain label there.
      function StatusBadge({ status, className = "" }) {
        const isRunning = (status || "").toLowerCase() === "running";
        return (
          <span className={`${getBadgeClass(status)} ${className}`.trim()}>
            {isRunning && <Spinner className="w-3 h-3 mr-1.5" />}
            {status || "-"}
          </span>
        );
      }

      function JobCard({ job, expanded, onToggleExpanded, onRunDiscovery, onTriggerRenovate, onTriggerAllRenovate, onCancelRenovate, authInfo }) {
        const [sortConfig, setSortConfig] = useState({
          key: "status",
          direction: "asc",
        });
        const [infoTooltipPos, setInfoTooltipPos] = useState(null);
        const infoIconRef = useRef(null);
        const showInfoTooltip = () => {
          if (!infoIconRef.current) return;
          const rect = infoIconRef.current.getBoundingClientRect();
          setInfoTooltipPos({ top: rect.bottom + 8, left: rect.left + rect.width / 2 });
        };
        const hideInfoTooltip = () => setInfoTooltipPos(null);
        const actionHint = permissionHint(authInfo);
        const canTrigger = can(job, "trigger");
        const canTriggerAll = can(job, "triggerAll");
        const canCancel = can(job, "cancel");
        const canDiscovery = can(job, "discovery");
        const canViewLogs = can(job, "logs");
        const readOnly = job.role === "reader";
        // A policy halt outranks a missing permission: it blocks everyone, so
        // reporting the permission first would send the user down a dead end.
        const haltedHint = job.accepted === false ? "Halted by the operator's policy" : undefined;
        const discoveryBlocked = haltedHint || (canDiscovery ? undefined : actionHint);
        const triggerAllBlocked = haltedHint || (canTriggerAll ? undefined : actionHint);
        const STATUS_FILTERS = ["Onboarding Closed", "Disabled", "No Config"];
        const jobKey = jobStorageKey(job);
        // Expansion is owned by App so the expand/collapse-all controls can drive it.
        const toggleOpen = () => onToggleExpanded(jobKey);
        const [hiddenStatuses, setHiddenStatuses] = useState(() => {
          try {
            const stored = JSON.parse(localStorage.getItem(`hiddenStatuses:${jobKey}`) || '[]');
            return Array.isArray(stored) ? stored : [];
          } catch {
            return [];
          }
        });
        const toggleStatusFilter = (status) => {
          setHiddenStatuses((prev) => {
            const next = prev.includes(status) ? prev.filter((s) => s !== status) : [...prev, status];
            try { localStorage.setItem(`hiddenStatuses:${jobKey}`, JSON.stringify(next)); } catch {}
            return next;
          });
        };
        const [hideNoPRs, setHideNoPRs] = useState(() => {
          try { return localStorage.getItem(`hideNoPRs:${jobKey}`) === 'true'; } catch { return false; }
        });
        const toggleHideNoPRs = () => setHideNoPRs(prev => {
          const next = !prev;
          try { localStorage.setItem(`hideNoPRs:${jobKey}`, String(next)); } catch {}
          return next;
        });
        const [hideNoIssues, setHideNoIssues] = useState(() => {
          try { return localStorage.getItem(`hideNoIssues:${jobKey}`) === 'true'; } catch { return false; }
        });
        const toggleHideNoIssues = () => setHideNoIssues(prev => {
          const next = !prev;
          try { localStorage.setItem(`hideNoIssues:${jobKey}`, String(next)); } catch {}
          return next;
        });
        const sortedProjects = useMemo(() => {
          let sorted = getSortedProjects(job.projects, sortConfig);
          if (hiddenStatuses.length > 0) {
            sorted = sorted.filter((p) => !hiddenStatuses.includes(p.renovateResultStatus));
          }
          if (hideNoPRs) {
            sorted = sorted.filter((p) => {
              const pa = p.prActivity;
              return pa && ((pa.created || 0) + (pa.updated || 0) + (pa.unchanged || 0) + (pa.automerged || 0)) > 0;
            });
          }
          if (hideNoIssues) {
            sorted = sorted.filter((p) => p.logIssues && (p.logIssues.warnCount > 0 || p.logIssues.errorCount > 0));
          }
          return sorted;
        }, [job.projects, sortConfig, hiddenStatuses, hideNoPRs, hideNoIssues]);
        const hasActiveFilters = hiddenStatuses.length > 0 || hideNoPRs || hideNoIssues;
        const open = expanded;
        useEffect(() => {
          if (hasActiveFilters && sortedProjects.length === 0 && expanded) {
            onToggleExpanded(jobKey);
          }
        }, [hasActiveFilters, sortedProjects.length]); // eslint-disable-line react-hooks/exhaustive-deps
        const statusCounts = useMemo(() => {
          const counts = {};
          for (const s of STATUS_FILTERS) counts[s] = 0;
          for (const p of (job.projects || [])) {
            if (STATUS_FILTERS.includes(p.renovateResultStatus)) counts[p.renovateResultStatus]++;
          }
          return counts;
        }, [job.projects]);
        const [expandedProjects, setExpandedProjects] = useState(() => new Set());
        const toggleProjectExpanded = (name) => {
          setExpandedProjects((prev) => {
            const next = new Set(prev);
            if (next.has(name)) {
              next.delete(name);
            } else {
              next.add(name);
            }
            return next;
          });
        };
        const [expandedIssues, setExpandedIssues] = useState(() => new Set());
        const toggleIssueExpanded = (name) => {
          setExpandedIssues((prev) => {
            const next = new Set(prev);
            if (next.has(name)) {
              next.delete(name);
            } else {
              next.add(name);
            }
            return next;
          });
        };
        const [showOptions, setShowOptions] = useState(false);
        const [optionsPos, setOptionsPos] = useState({ top: 0, right: 0 });
        const optionsBtnRef = useRef(null);

        const handleSort = (key) => {
          let direction = "asc";
          if (sortConfig.key === key && sortConfig.direction === "asc") {
            direction = "desc";
          }
          setSortConfig({ key, direction });
        };

        const SortIcon = ({ columnKey }) => {
          if (sortConfig.key !== columnKey) {
            return (
              <svg
                className="w-4 h-4 text-gray-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  strokeWidth={2}
                  d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"
                />
              </svg>
            );
          }

          return sortConfig.direction === "asc" ? (
            <svg
              className="w-4 h-4 text-primary"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                strokeLinecap="round"
                strokeLinejoin="round"
                strokeWidth={2}
                d="M5 15l7-7 7 7"
              />
            </svg>
          ) : (
            <svg
              className="w-4 h-4 text-primary"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                strokeLinecap="round"
                strokeLinejoin="round"
                strokeWidth={2}
                d="M19 9l-7 7-7-7"
              />
            </svg>
          );
        };

        return (
          <div className="relative bg-white dark:bg-slate-800 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-all duration-200">
            <div
              className="flex items-center gap-2 sm:gap-3 px-3 sm:px-4 py-2.5 cursor-pointer hover:bg-gray-50 dark:hover:bg-slate-700/50 transition-colors"
              onClick={toggleOpen}
            >
              {/* Chevron */}
              <button
                className={`transform transition-transform duration-200 flex-shrink-0 ${
                  open ? "rotate-90" : ""
                }`}
                aria-label={
                  open ? "Collapse job details" : "Expand job details"
                }
                aria-hidden="true"
              >
                <svg
                  className="w-4 h-4 text-gray-500 dark:text-slate-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    strokeWidth="2"
                    d="M9 5l7 7-7 7"
                  />
                </svg>
              </button>

              {/* Title: name + namespace */}
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2 min-w-0">
                  <ProviderLogo platform={job.platform} />
                  <h2 className="text-sm sm:text-base font-bold text-gray-900 dark:text-slate-100 truncate leading-tight">
                    {job.name}
                  </h2>
                  {readOnly && (
                    <span
                      className="flex-shrink-0 px-2 py-0.5 rounded-full border border-gray-300 dark:border-slate-600 text-[0.688rem] font-semibold uppercase tracking-wide text-gray-500 dark:text-slate-400"
                      title={actionHint}
                    >
                      Read-only
                    </span>
                  )}
                </div>
                <p className="text-xs text-gray-500 dark:text-slate-400 leading-tight font-mono">
                  {job.namespace}
                </p>
              </div>

              {/* Config info icon */}
              {(job.discoveryFilters?.length > 0 || job.discoverTopics?.length > 0) && (
                <div className="flex-shrink-0" onClick={(e) => e.stopPropagation()}>
                  <svg
                    ref={infoIconRef}
                    className={`w-4 h-4 cursor-default transition-colors ${infoTooltipPos ? "text-primary" : "text-gray-400 dark:text-slate-500"}`}
                    fill="currentColor"
                    viewBox="0 0 20 20"
                    aria-label="Job configuration info"
                    onMouseEnter={showInfoTooltip}
                    onMouseLeave={hideInfoTooltip}
                  >
                    <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd" />
                  </svg>
                  {infoTooltipPos && (
                    <div
                      style={{ position: "fixed", top: infoTooltipPos.top, left: infoTooltipPos.left, transform: "translateX(-50%)" }}
                      className="z-50 w-64 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-600 rounded-lg shadow-lg p-3 text-left pointer-events-none"
                      onMouseEnter={showInfoTooltip}
                      onMouseLeave={hideInfoTooltip}
                    >
                      <div className="absolute -top-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-white dark:bg-slate-800 border-l border-t border-gray-200 dark:border-slate-600 rotate-45" />
                      {job.discoveryFilters?.length > 0 && (
                        <div className="mb-2">
                          <p className="text-[0.688rem] font-semibold uppercase tracking-wide text-gray-500 dark:text-slate-400 mb-1">Discovery Filters</p>
                          <ul className="space-y-0.5">
                            {job.discoveryFilters.map((f, i) => (
                              <li key={i} className="font-mono text-xs text-gray-800 dark:text-slate-200 truncate" title={f}>{f}</li>
                            ))}
                          </ul>
                        </div>
                      )}
                      {job.discoverTopics?.length > 0 && (
                        <div>
                          <p className="text-[0.688rem] font-semibold uppercase tracking-wide text-gray-500 dark:text-slate-400 mb-1">Discover Topics</p>
                          <ul className="space-y-0.5">
                            {job.discoverTopics.map((t, i) => (
                              <li key={i} className="font-mono text-xs text-gray-800 dark:text-slate-200 truncate" title={t}>{t}</li>
                            ))}
                          </ul>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* Schedule info — hidden on small screens */}
              <div className="hidden lg:flex items-center gap-1.5 flex-shrink-0 w-[15rem]">
                <svg
                  className="w-3.5 h-3.5 text-primary flex-shrink-0"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    strokeWidth={2}
                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                  />
                </svg>
                <span className="text-xs text-gray-600 dark:text-slate-300 font-medium">
                  Schedule:
                </span>
                <span className="font-mono text-xs font-semibold text-gray-900 dark:text-slate-100 truncate">
                  {job.cronExpression || "Not set"}
                </span>
              </div>

              {/* Next Run countdown — hidden on small screens */}
              <div className="hidden lg:flex items-center gap-1.5 flex-shrink-0 w-[14rem]">
                <svg
                  className="w-3.5 h-3.5 text-primary flex-shrink-0"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    strokeWidth={2}
                    d="M13 10V3L4 14h7v7l9-11h-7z"
                  />
                </svg>
                <span className="text-xs text-gray-600 dark:text-slate-300 font-medium">
                  Next Run:
                </span>
                {job.nextSchedule ? (
                  <Countdown nextSchedule={job.nextSchedule} />
                ) : (
                  <span className="text-xs text-gray-500 dark:text-slate-400">N/A</span>
                )}
              </div>

              {/* Action buttons */}
              <div className="flex items-center gap-2 ml-auto flex-shrink-0" onClick={(e) => e.stopPropagation()}>
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    onRunDiscovery(job);
                  }}
                  disabled={job.discoveryRunning || !!discoveryBlocked}
                  title={discoveryBlocked}
                  className="bg-primary hover:bg-primary-hover disabled:opacity-60 disabled:cursor-not-allowed text-white px-2 sm:px-3 py-1.5 rounded-lg font-semibold text-[0.813rem] shadow-sm hover:shadow-md active:scale-98 transition-all flex items-center justify-center gap-1.5"
                  aria-label={
                    discoveryBlocked
                      ? discoveryBlocked
                      : job.discoveryRunning
                        ? "Discovery running"
                        : `Run discovery for ${job.name}`
                  }
                >
                  {job.discoveryRunning ? (
                    <Spinner />
                  ) : (
                    <svg
                      className="w-3.5 h-3.5 flex-shrink-0"
                      fill="currentColor"
                      viewBox="0 0 20 20"
                    >
                      <path
                        fillRule="evenodd"
                        d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z"
                        clipRule="evenodd"
                      />
                    </svg>
                  )}
                  <span className="hidden sm:inline">
                    {job.discoveryRunning ? "Running..." : "Run Discovery"}
                  </span>
                </button>

                <div className="flex items-stretch shadow-sm rounded-lg overflow-hidden">
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      onTriggerAllRenovate(job);
                    }}
                    disabled={job.triggeringAll || !job.projects || job.projects.length === 0 || !!triggerAllBlocked}
                    title={triggerAllBlocked}
                    className="bg-primary hover:bg-primary-hover disabled:opacity-60 disabled:cursor-not-allowed text-white px-2 sm:px-3 py-1.5 font-semibold text-[0.813rem] hover:shadow-md active:scale-98 transition-all flex items-center justify-center gap-1.5"
                    aria-label={
                      triggerAllBlocked
                        ? triggerAllBlocked
                        : job.triggeringAll
                          ? "Triggering all projects"
                          : `Trigger all projects for ${job.name}`
                    }
                  >
                    {job.triggeringAll ? (
                      <Spinner />
                    ) : (
                      <svg
                        className="w-3.5 h-3.5 flex-shrink-0"
                        fill="currentColor"
                        viewBox="0 0 20 20"
                      >
                        <path
                          fillRule="evenodd"
                          d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                          clipRule="evenodd"
                        />
                      </svg>
                    )}
                    <span className="hidden sm:inline">
                      {job.triggeringAll ? "Triggering..." : "Trigger All"}
                    </span>
                  </button>
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      onTriggerAllRenovate(job, { debug: true });
                    }}

                            ) : null;
                          })()}
                          {(() => {
                            const prUrl = buildPRUrl(job.platform, job.platformEndpoint, project.name);
                            return prUrl ? (
                              <a
                                href={prUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="inline-flex items-center gap-1 bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600 text-gray-700 dark:text-slate-200 px-3 py-1.5 rounded-lg font-semibold text-[0.813rem] shadow-sm hover:shadow-md transition-all"
                                aria-label={`View open PRs/MRs for ${project.name}`}
                                title={`Open PRs/MRs for ${project.name}`}
                              >
                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                </svg>
                              </a>
                            ) : null;
                          })()}
                        </div>
                      </div>
                    </>
                  );
                };

                return <ProjectCard key={project.name} />;
              })
                  ) : (
                    <div className="p-8 text-center text-gray-500 dark:text-slate-400">
                      {hasActiveFilters
                        ? `0 of ${(job.projects || []).length} projects matched your filters`
                        : "No projects found. Run discovery to find projects."}
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      window.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
