    <link

    <script src="js/tailwind.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {

              primary: "#009bc5",

    <script src="js/theme-utils.js"></script>

      import { React, createRoot } from './js/react-bundle.esm.js';
      window.React = React;
      window.createRoot = createRoot;
    </script>
    <script type="text/babel" src="components/Spinner.js"></script>

    <script type="text/babel" src="components/SiteHeader.js"></script>
    <script type="text/babel" src="components/StatBadge.js"></script>
    <script type="text/babel" src="components/StickyToolbar.js"></script>

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useCallback, useMemo, useRef } = React;

      const formatTimeAgo = (timestamp) => {
        const now = new Date();
        const past = new Date(timestamp);
        const diffInSeconds = Math.floor((now - past) / 1000);

        if (diffInSeconds < 60) {
          return `${diffInSeconds}s ago`;
        } else if (diffInSeconds < 3600) {
          const minutes = Math.floor(diffInSeconds / 60);
          return `${minutes}m ago`;
        } else if (diffInSeconds < 86400) {
          const hours = Math.floor(diffInSeconds / 3600);
          return `${hours}h ago`;
        } else {
          const days = Math.floor(diffInSeconds / 86400);
          return `${days}d ago`;
        }
      };

      const formatLocalTime = (timestamp) => {
        if (!timestamp) return "Never";
        const date = new Date(timestamp);
        return date.toLocaleString(undefined, {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          timeZoneName: 'short'
        });
      };

      const formatCountdown = (timestamp) => {
        const now = new Date();
        const future = new Date(timestamp);
        const diffInSeconds = Math.floor((future - now) / 1000);

        if (diffInSeconds < 0) {
          return "Overdue";
        }

        const days = Math.floor(diffInSeconds / 86400);
        const hours = Math.floor((diffInSeconds % 86400) / 3600);
        const minutes = Math.floor((diffInSeconds % 3600) / 60);
        const seconds = diffInSeconds % 60;

        if (days > 0) {
          return { days, hours, minutes, seconds };
        } else if (hours > 0) {
          return { hours, minutes, seconds };
        } else if (minutes > 0) {
          return { minutes, seconds };
        } else {
          return { seconds };
        }
      };

      const getProjectOpenPRCount = (project) => {
        const activity = project?.prActivity;
        if (!activity) {
          return 0;
        }

        return (activity.created || 0)
          + (activity.updated || 0)
          + (activity.unchanged || 0);
      };

      const projectHasIssues = (project) => {
        return !!(
          project?.logIssues
          && ((project.logIssues.warnCount || 0) > 0
            || (project.logIssues.errorCount || 0) > 0)
        );
      };

      // Expansion state a job card opens in before the user has touched it.
      // This is the single switch for the dashboard default.
      const JOB_CARDS_EXPANDED_BY_DEFAULT = true;

      // The jobs whose expansion the user changed away from the constant above --
      // the only thing persisted. Storing the deviations instead of the expanded
      // jobs is what keeps that constant meaningful: flipping it re-applies to
      // every card nobody has touched, while explicit choices still survive.
      const TOGGLED_JOB_CARDS_STORAGE_KEY = "toggledJobCards";

      const jobStorageKey = (job) => `${job.namespace}/${job.name}`;

      const isJobCardExpanded = (toggledJobCardKeys, jobKey) => (
        toggledJobCardKeys.has(jobKey)
          ? !JOB_CARDS_EXPANDED_BY_DEFAULT
          : JOB_CARDS_EXPANDED_BY_DEFAULT
      );

      const projectMatchesStatFilter = (project, filterKey) => {
        if (!filterKey) {
          return true;
        }

        switch (filterKey) {
          case "withIssues":
            return projectHasIssues(project);
          case "openPRs":
            return getProjectOpenPRCount(project) > 0;
          case "pending":
            return (project?.prActivity?.needsApproval || 0) > 0;
          default:
            return (project?.status || "").toLowerCase() === filterKey;
        }
      };

      const buildDashboardUrl = (platform, endpoint, projectName) => {
        if (!platform || platform === 'github') {
          let base = 'https://github.com';
          if (endpoint && !endpoint.includes('api.github.com')) {
            base = endpoint.replace(/\/api\/v\d+\/?$/, '').replace(/\/$/, '');
          }
          return `${base}/${projectName}/issues?q=${encodeURIComponent('is:issue is:open "Dependency Dashboard" in:title')}`;
        } else if (platform === 'gitlab') {
          const base = (endpoint || 'https://gitlab.com').replace(/\/api\/v\d+\/?$/, '').replace(/\/$/, '');
          return `${base}/${projectName}/-/issues?search=Dependency+Dashboard&state=opened`;
        } else if (platform === 'gitea' || platform === 'forgejo') {
          if (endpoint) {
            const base = endpoint.replace(/\/api\/v\d+\/?$/, '').replace(/\/$/, '');
            return `${base}/${projectName}/issues?q=Dependency+Dashboard&type=comment&state=open`;
          }
        }
        return null;
      };

      const _platformWebBase = (platform, endpoint) => {
        if (!platform || platform === 'github') {
          if (endpoint && !endpoint.includes('api.github.com')) {
            return endpoint.replace(/\/api\/v\d+\/?$/, '').replace(/\/$/, '');
          }
          return 'https://github.com';
        } else if (platform === 'gitlab') {
          return (endpoint || 'https://gitlab.com').replace(/\/api\/v\d+\/?$/, '').replace(/\/$/, '');
        } else if (platform === 'bitbucket') {
          return 'https://bitbucket.org';
        } else if (platform === 'bitbucket-server') {
          return endpoint
            ? endpoint.replace(/\/rest\/api\/(?:latest|\d+(?:\.\d+)*)\/?$/, '').replace(/\/$/, '')
            : null;
        } else if (platform === 'gitea' || platform === 'forgejo') {
          return endpoint ? endpoint.replace(/\/api\/v\d+\/?$/, '').replace(/\/$/, '') : null;
        }
        return null;
      };

      const _bitbucketServerRepoUrl = (base, projectName) => {
        const separator = projectName ? projectName.indexOf('/') : -1;
        if (separator <= 0 || separator === projectName.length - 1) return null;

        const projectKey = projectName.slice(0, separator);
        const repoSlug = projectName.slice(separator + 1);
        if (projectKey.startsWith('~')) {
          return `${base}/users/${encodeURIComponent(projectKey.slice(1))}/repos/${encodeURIComponent(repoSlug)}`;
        }
        return `${base}/projects/${encodeURIComponent(projectKey)}/repos/${encodeURIComponent(repoSlug)}`;
      };

      const buildPRUrl = (platform, endpoint, projectName) => {
        const base = _platformWebBase(platform, endpoint);
        if (!base) return null;
        if (!platform || platform === 'github') return `${base}/${projectName}/pulls`;
        if (platform === 'gitlab') return `${base}/${projectName}/-/merge_requests`;
        if (platform === 'bitbucket') return `${base}/${projectName}/pull-requests`;
        if (platform === 'bitbucket-server') {
          const repoUrl = _bitbucketServerRepoUrl(base, projectName);
          return repoUrl ? `${repoUrl}/pull-requests` : null;
        }
        if (platform === 'gitea' || platform === 'forgejo') return `${base}/${projectName}/pulls`;
        return null;
      };

      const buildSinglePRUrl = (platform, endpoint, projectName, prNumber) => {
        if (!prNumber) return null;
        const base = _platformWebBase(platform, endpoint);
        if (!base) return null;
        if (!platform || platform === 'github') return `${base}/${projectName}/pull/${prNumber}`;
        if (platform === 'gitlab') return `${base}/${projectName}/-/merge_requests/${prNumber}`;
        if (platform === 'bitbucket') return `${base}/${projectName}/pull-requests/${prNumber}`;
        if (platform === 'bitbucket-server') {
          const repoUrl = _bitbucketServerRepoUrl(base, projectName);
          return repoUrl ? `${repoUrl}/pull-requests/${prNumber}` : null;
        }
        if (platform === 'gitea' || platform === 'forgejo') return `${base}/${projectName}/pulls/${prNumber}`;
        return null;
      };

      function useTooltip(project) {
        const [isVisible, setIsVisible] = useState(false);
        const containerRef = React.useRef(null);
        const timeoutRef = React.useRef(null);
        const portalRef = React.useRef(null);

        const handleMouseEnter = (e) => {
          if (e.target.closest('[data-no-tooltip]')) return;
          timeoutRef.current = setTimeout(() => {
            setIsVisible(true);
          }, 500);
        };

        const handleMouseMove = (e) => {
          if (e.target.closest('[data-no-tooltip]')) {
            if (timeoutRef.current) {
              clearTimeout(timeoutRef.current);
              timeoutRef.current = null;
            }
            setIsVisible(false);
          } else {
            if (!isVisible && !timeoutRef.current) {
              timeoutRef.current = setTimeout(() => {
                setIsVisible(true);
                timeoutRef.current = null;
              }, 500);
            }
          }
        };

        const handleMouseLeave = () => {
          if (timeoutRef.current) clearTimeout(timeoutRef.current);
          setIsVisible(false);
        };

        useEffect(() => {
          return () => {
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
          };
        }, []);

        useEffect(() => {
          const container = document.createElement('div');
          document.body.appendChild(container);
          const root = window.createRoot(container);
          portalRef.current = { container, root };
          return () => {
            root.unmount();
            if (document.body.contains(container)) document.body.removeChild(container);
          };
        }, []);

        useEffect(() => {
          if (!portalRef.current) return;
          const { root } = portalRef.current;
          if (isVisible && project && project.duration) {
            const top = containerRef.current
              ? `${containerRef.current.getBoundingClientRect().top - 12}px`
              : '0';
            root.render(
              React.createElement('div', {
                className: 'fixed z-50 pointer-events-none border-0',
                style: { left: '50%', top, transform: 'translate(-50%, -100%)' }
              },
                React.createElement('div', {
                  className: 'bg-gray-900 dark:bg-slate-700 text-white text-sm rounded-lg shadow-xl px-3 py-2 max-w-xs animate-fadeIn border-0 relative'
                },
                  React.createElement('div', { className: 'font-medium mb-1 text-gray-100' }, 'Last Run Duration'),
                  React.createElement('div', { className: 'text-gray-300 dark:text-slate-300 whitespace-nowrap' }, project.duration),
                  React.createElement('div', { className: 'absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-1/2 rotate-45 w-2 h-2 bg-gray-900 dark:bg-slate-700 border-0' })
                )
              )
            );
          } else {
            root.render(null);
          }
        }, [isVisible, project]);

        return {
          containerRef,
          tooltipProps: {
            onMouseEnter: handleMouseEnter,
            onMouseMove: handleMouseMove,
            onMouseLeave: handleMouseLeave,
          },
          tooltipElement: null,
        };
      }

      function Countdown({ nextSchedule }) {
        const [countdown, setCountdown] = useState(() =>
          formatCountdown(nextSchedule)
        );

        useEffect(() => {
          const interval = setInterval(() => {
            setCountdown(formatCountdown(nextSchedule));
          }, 1000);

          return () => clearInterval(interval);
        }, [nextSchedule]);

        if (countdown === "Overdue") {
          return <span className="text-error font-semibold">Overdue</span>;
        }

        const pad = (n) => String(n).padStart(2, "0");
        const segments = [];
        if (countdown.days !== undefined) segments.push(`${countdown.days}d`);
        if (countdown.hours !== undefined) segments.push(`${pad(countdown.hours)}h`);
        if (countdown.minutes !== undefined) segments.push(`${pad(countdown.minutes)}m`);
        if (countdown.seconds !== undefined) segments.push(`${pad(countdown.seconds)}s`);

        return (
          <span className="font-mono text-xs font-semibold text-primary tabular-nums">
            {segments.join(" ")}
          </span>
        );
      }

      function Toast({ toast, onClose }) {
        const getToastClasses = (type) => {
          const base =
            "w-full sm:min-w-[300px] sm:max-w-[400px] p-3 sm:p-4 rounded-lg shadow-xl backdrop-blur-sm border border-white/20 text-white";
          const gradients = {
            success: "bg-gradient-to-br from-success/95 to-success/85",
            error: "bg-gradient-to-br from-error/95 to-error/85",
            info: "bg-gradient-to-br from-primary/95 to-primary/85",
          };
          return `${base} ${gradients[type]}`;
        };

        return (
          <div className={getToastClasses(toast.type)}>
            <div className="flex items-start gap-3">
              <div className="flex-shrink-0">
                {toast.type === "success" && (
                  <svg
                    className="w-5 h-5"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      fillRule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                      clipRule="evenodd"
                    />
                  </svg>
                )}
                {toast.type === "error" && (
                  <svg
                    className="w-5 h-5"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      fillRule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                      clipRule="evenodd"
                    />
                  </svg>
                )}
                {toast.type === "info" && (
                  <svg
                    className="w-5 h-5"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      fillRule="evenodd"
                      d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                      clipRule="evenodd"
                    />
                  </svg>
                )}
              </div>
              <div className="flex-1">
                <p className="font-semibold text-sm">{toast.title}</p>
                {toast.message && (
                  <p className="text-xs mt-1 opacity-90">{toast.message}</p>
                )}
              </div>
              <button
                onClick={() => onClose(toast.id)}
                className="text-current opacity-60 hover:opacity-100 transition"
                aria-label="Close notification"
              >
                <svg
                  className="w-4 h-4"
                  fill="currentColor"
                  viewBox="0 0 20 20"
                  aria-hidden="true"
                >
                  <path
                    fillRule="evenodd"
                    d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                    clipRule="evenodd"
                  />
                </svg>
              </button>
            </div>
          </div>
        );
      }

      function ToastContainer({ toasts, onRemove }) {
        if (toasts.length === 0) return null;

        return (
          <div className="fixed top-4 right-2 left-2 sm:left-auto sm:right-4 z-50 space-y-3 sm:w-auto">
            {toasts.map((toast) => (
              <div
                key={toast.id}
                style={{
                  animation: toast.removing
                    ? "slideOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards"
                    : "slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1)",
                }}
              >
                <Toast toast={toast} onClose={onRemove} />
              </div>
            ))}
          </div>
        );
      }

      const BASE = window.__BASE_PATH__ || "";
      const withBase = (path) => (path.startsWith("/") ? BASE + path : path);

      const authFetch = async (url, options = {}) => {
        const response = await fetch(withBase(url), options);
        if (response.status === 401) {
          window.location.href = BASE + "/auth/login";
          throw new Error("Unauthorized");
        }
        return response;
      };

      // The server ships the permitted actions per job, so the frontend never
      // maps roles to actions itself: two readers can differ on log access.
      const can = (job, permission) =>
        Array.isArray(job?.permissions) && job.permissions.includes(permission);

      // Explains a disabled control. Anonymous visitors get a route to access,
      // signed-in users get the reason they lack it.
      const permissionHint = (authInfo) =>
        authInfo && authInfo.enabled && !authInfo.authenticated
          ? "Sign in with an account that has admin access to use this"
          : "Requires admin access";

      function App() {
        const [jobs, setJobs] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [stats, setStats] = useState({
          total: 0,
          scheduled: 0,
          running: 0,
          completed: 0,
          failed: 0,
          withIssues: 0,
          openPRs: 0,
          pending: 0,
        });
        const [version, setVersion] = useState(null);
        const [toasts, setToasts] = useState([]);
        const nextToastIdRef = useRef(0);
        const hasLoadedOnce = useRef(false);
        const [authInfo, setAuthInfo] = useState(null);
        // Set when the operator cannot enforce its access rules. It then hides
        // every job, so this is the only explanation the visitor gets.
        const [accessStatus, setAccessStatus] = useState(null);
        // First-run setup state. The guide itself lives on /setup; the
        // dashboard only decides whether to send the visitor there. Null
        // until the first fetch answers, {visible: false} once an auth
        // provider is configured. The dismissed flag is written on /setup
        // ("Skip guide") and cleared by opening /setup again.
        const [setupStatus, setSetupStatus] = useState(null);
        const [setupGuideDismissed] = useState(() => {
          try {
            return localStorage.getItem("setupGuideDismissed") === "true";
          } catch {
            return false;
          }
        });
        const STAT_FILTER_LABELS = {
          failed: "Failed",
          scheduled: "Scheduled",
          running: "Running",
          completed: "Completed",
          openPRs: "Open PRs",
          pending: "Pending",
          withIssues: "With Issues",
        };
        const STAT_FILTER_PARAM = "filter";

        const [selectedStatFilter, setSelectedStatFilter] = useState(() => {
          try {
            const fromUrl = new URLSearchParams(window.location.search).get(STAT_FILTER_PARAM);
            if (fromUrl && STAT_FILTER_LABELS[fromUrl]) {
              return fromUrl;
            }
            const stored = localStorage.getItem('selectedStatFilter');
            return stored && STAT_FILTER_LABELS[stored] ? stored : null;
          } catch {
            return null;
          }
        });

        useEffect(() => {
          try {
            const url = new URL(window.location.href);
            if (selectedStatFilter) {
              url.searchParams.set(STAT_FILTER_PARAM, selectedStatFilter);
            } else {
              url.searchParams.delete(STAT_FILTER_PARAM);
            }
            window.history.replaceState(null, "", url.pathname + url.search + url.hash);
          } catch {}
        }, [selectedStatFilter]);

        const persistStatFilter = (value) => {
          try {
            if (value === null) {
              localStorage.removeItem('selectedStatFilter');
            } else {
              localStorage.setItem('selectedStatFilter', value);
            }
          } catch {}
        };

        const toggleStatFilter = useCallback((filterKey) => {
          setSelectedStatFilter((current) => {
            const next = current === filterKey ? null : filterKey;
            persistStatFilter(next);
            return next;
          });
        }, []);

        const clearStatFilter = useCallback(() => {
          setSelectedStatFilter(null);
          persistStatFilter(null);
        }, []);

        // Job cards open according to JOB_CARDS_EXPANDED_BY_DEFAULT. This Set holds
        // the jobs the user toggled *away* from that default -- not the expanded
        // ones -- so a card the user collapsed stays collapsed across the 30s
        // auto-refresh while untouched cards keep following the constant.
        const [toggledJobCardKeys, setToggledJobCardKeys] = useState(() => {
          try {
            const stored = JSON.parse(localStorage.getItem(TOGGLED_JOB_CARDS_STORAGE_KEY) || '[]');
            return new Set(Array.isArray(stored) ? stored : []);
          } catch {
            return new Set();
          }
        });

        const persistToggledJobCardKeys = (keys) => {
          try { localStorage.setItem(TOGGLED_JOB_CARDS_STORAGE_KEY, JSON.stringify([...keys])); } catch {}
        };

        const toggleJobCardExpansion = useCallback((jobKey) => {
          setToggledJobCardKeys((current) => {
            const next = new Set(current);
            if (next.has(jobKey)) {
              next.delete(jobKey);
            } else {
              next.add(jobKey);
            }
            persistToggledJobCardKeys(next);
            return next;
          });
        }, []);

        const filteredJobs = useMemo(() => {
          if (!selectedStatFilter) {
            return jobs;
          }

          return jobs
            .map((job) => {
              const projects = (Array.isArray(job.projects) ? job.projects : [])
                .filter((project) => projectMatchesStatFilter(project, selectedStatFilter));

              return {
                ...job,
                projects,
              };
            })
            .filter((job) => job.projects.length > 0);
        }, [jobs, selectedStatFilter]);

        const filteredProjectCount = useMemo(() => {
          return filteredJobs.reduce(
            (total, job) => total + (Array.isArray(job.projects) ? job.projects.length : 0),
            0
          );
        }, [filteredJobs]);

        const SEARCH_PARAM = "search";

        const [searchTerm, setSearchTerm] = useState(() => {
          try {
            return new URLSearchParams(window.location.search).get(SEARCH_PARAM) || "";
          } catch {
            return "";
          }
        });

        useEffect(() => {
          try {
            const url = new URL(window.location.href);
            if (searchTerm) {
              url.searchParams.set(SEARCH_PARAM, searchTerm);
            } else {
              url.searchParams.delete(SEARCH_PARAM);
            }
            window.history.replaceState(null, "", url.pathname + url.search + url.hash);
          } catch {}
        }, [searchTerm]);

        const clearSearch = useCallback(() => setSearchTerm(""), []);

        const searchFilteredJobs = useMemo(() => {
          const term = searchTerm.trim().toLowerCase();
          if (!term) return filteredJobs;
          return filteredJobs
            .map((job) => ({
              ...job,
              projects: (Array.isArray(job.projects) ? job.projects : [])
                .filter((p) => (p.name || "").toLowerCase().includes(term)),
            }))
            .filter((job) => job.projects.length > 0);
        }, [filteredJobs, searchTerm]);

        const searchFilteredProjectCount = useMemo(() => {
          return searchFilteredJobs.reduce(
            (total, job) => total + (Array.isArray(job.projects) ? job.projects.length : 0),
            0
          );
        }, [searchFilteredJobs]);

        // Expand/collapse all only act on the jobs currently rendered, so neither
        // the stat filter nor the search box silently changes the state of a job
        // it hides.
        const expandedVisibleJobCount = useMemo(
          () => searchFilteredJobs.filter((job) => isJobCardExpanded(toggledJobCardKeys, jobStorageKey(job))).length,
          [searchFilteredJobs, toggledJobCardKeys]
        );

        // Whether a bulk action has to add or remove keys depends on the default,
        // so both buttons go through one helper stating the state they want.
        const setExpansionForVisibleJobs = useCallback((expanded) => {
          setToggledJobCardKeys((current) => {
            const next = new Set(current);
            searchFilteredJobs.forEach((job) => {
              const jobKey = jobStorageKey(job);
              if (expanded === JOB_CARDS_EXPANDED_BY_DEFAULT) {
                next.delete(jobKey);
              } else {
                next.add(jobKey);
              }
            });
            persistToggledJobCardKeys(next);
            return next;
          });
        }, [searchFilteredJobs]);

        const expandAllJobs = useCallback(
          () => setExpansionForVisibleJobs(true),
          [setExpansionForVisibleJobs]
        );

        const collapseAllJobs = useCallback(
          () => setExpansionForVisibleJobs(false),
          [setExpansionForVisibleJobs]
        );

        const addToast = useCallback(
          (type, title, message = "", duration = 5000) => {
            nextToastIdRef.current += 1;
            const id = nextToastIdRef.current;
            const toast = { id, type, title, message, removing: false };
            setToasts((prev) => [...prev, toast]);
            setTimeout(() => removeToast(id), duration);
          },
          []
        );

        const removeToast = (id) => {
          setToasts((prev) =>
            prev.map((t) => (t.id === id ? { ...t, removing: true } : t))
          );
          setTimeout(() => {
            setToasts((prev) => prev.filter((t) => t.id !== id));
          }, 400);
        };

        const calculateStats = (jobsList) => {
          const newStats = {
            total: 0,
            scheduled: 0,
            running: 0,
            completed: 0,
            failed: 0,
            withIssues: 0,
            openPRs: 0,
            pending: 0,
          };
          jobsList.forEach((job) => {
            if (Array.isArray(job.projects)) {
              newStats.total += job.projects.length;
              job.projects.forEach((project) => {
                const status = (project.status || "").toLowerCase();
                if (newStats.hasOwnProperty(status)) {
                  newStats[status]++;
                }
                if (projectHasIssues(project)) {
                  newStats.withIssues++;
                }
                newStats.openPRs += getProjectOpenPRCount(project);
                newStats.pending += project?.prActivity?.needsApproval || 0;
              });
            }
          });
          return newStats;
        };

        const loadJobs = useCallback(async () => {
          try {
            if (!hasLoadedOnce.current) {
              setLoading(true);
            }
            setError(null);

            // Fetched on every poll, not once on mount, so the banner clears as
            // soon as the configuration is fixed.
            fetch(BASE + "/api/v1/access/status")
              .then((res) => res.json())
              .then((data) => setAccessStatus(data))
              .catch(() => {});

            // Plain fetch on purpose: for anonymous visitors with auth enabled
            // this answers 401, which must not bounce them to the login page.
            fetch(BASE + "/api/v1/setup/status")
              .then((res) => (res.ok ? res.json() : null))
              .then((data) => { if (data) setSetupStatus(data); })
              .catch(() => {});

            const response = await authFetch("/api/v1/renovatejobs");
            if (!response.ok)
              throw new Error(`HTTP ${response.status}: Failed to fetch jobs`);

            const data = await response.json();
            if (typeof data !== "object" || data === null)
              throw new Error("Invalid response format");

            let jobsList = Array.isArray(data)
              ? data.sort((a, b) => (a.name || "").localeCompare(b.name || ""))
              : [];

            for (const job of jobsList) {
              job.discoveryRunning = job.discoveryStatus === "running";
              if (Array.isArray(job.projects)) {
                job.projects.forEach((project) => {
                  project.triggering = false;
                  project.cancelling = false;
                });
              }
            }

            hasLoadedOnce.current = true;
            setJobs(jobsList);
            setStats(calculateStats(jobsList));
          } catch (err) {
            console.error("Error loading jobs:", err);
            setError(err.message);
            addToast("error", "Failed to load jobs", err.message);
          } finally {
            setLoading(false);
          }
        }, [addToast]);

        const runDiscovery = async (job) => {
          if (job.discoveryRunning) return;

          setJobs((prev) =>
            prev.map((j) =>
              j.name === job.name && j.namespace === job.namespace
                ? { ...j, discoveryRunning: true }
                : j
            )
          );

          try {
            const response = await authFetch("/api/v1/discovery/start", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                renovateJob: job.name,
                namespace: job.namespace,
              }),
            });

            if (response.ok) {
              addToast(
                "success",
                "Discovery Started",
                `Discovery job for ${job.name} has been triggered`
              );
            } else {
              const errorText = await response.text();
              throw new Error(errorText || "Failed to start discovery");
            }
          } catch (err) {
            console.error("Error running discovery:", err);
            setJobs((prev) =>
              prev.map((j) =>
                j.name === job.name && j.namespace === job.namespace
                  ? { ...j, discoveryRunning: false }
                  : j
              )
            );
            addToast("error", "Discovery Failed", err.message);
          }
        };

        const triggerRenovate = async (job, project, executionOptions = {}) => {
          if (project.triggering) return;

          setJobs((prev) =>
            prev.map((j) => {
              if (j.name === job.name && j.namespace === job.namespace) {
                return {
                  ...j,
                  projects: j.projects.map((p) =>
                    p.name === project.name ? { ...p, triggering: true } : p
                  ),
                };
              }
              return j;
            })
          );

          try {
            const response = await authFetch("/api/v1/renovate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                renovateJob: job.name,
                namespace: job.namespace,
                project: project.name,
                executionOptions: Object.keys(executionOptions).length > 0 ? executionOptions : undefined,
              }),
            });

            if (response.ok) {
              addToast(
                "success",
                "Renovate Triggered",
                `Job triggered for ${project.name}`
              );
            } else {
              const errorText = await response.text();
              throw new Error(errorText || "Failed to trigger renovate");
            }
          } catch (err) {
            console.error("Error triggering renovate:", err);
            addToast("error", "Trigger Failed", err.message);
          } finally {
            loadJobs();
          }
        };

        const cancelRenovate = async (job, project) => {
          if (project.cancelling) return;

          setJobs((prev) =>
            prev.map((j) => {
              if (j.name === job.name && j.namespace === job.namespace) {
                return {
                  ...j,
                  projects: j.projects.map((p) =>
                    p.name === project.name ? { ...p, cancelling: true } : p
                  ),
                };
              }
              return j;
            })
          );

          try {
            const response = await authFetch("/api/v1/renovate/cancel", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                renovateJob: job.name,
                namespace: job.namespace,
                project: project.name,
              }),
            });

            if (response.ok) {
              addToast(
                "success",
                "Renovate Cancelled",
                `Job cancelled for ${project.name}`
              );
            } else {
              const errorText = await response.text();
              throw new Error(errorText || "Failed to cancel renovate");
            }
          } catch (err) {
            console.error("Error cancelling renovate:", err);
            addToast("error", "Cancel Failed", err.message);
          } finally {
            loadJobs();
          }
        };

        const triggerAllRenovate = async (job, executionOptions = {}) => {
          if (job.triggeringAll) return;

          setJobs((prev) =>
            prev.map((j) =>
              j.name === job.name && j.namespace === job.namespace
                ? { ...j, triggeringAll: true }
                : j
            )
          );

          try {
            const response = await authFetch("/api/v1/renovate/all", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                renovateJob: job.name,
                namespace: job.namespace,
                executionOptions: Object.keys(executionOptions).length > 0 ? executionOptions : undefined,
              }),
            });

            if (response.ok) {
              addToast(
                "success",
                "All Triggered",
                `All projects triggered for ${job.name}`
              );
            } else {
              const errorText = await response.text();
              throw new Error(errorText || "Failed to trigger all projects");
            }
          } catch (err) {
            console.error("Error triggering all projects:", err);
            addToast("error", "Trigger All Failed", err.message);
          } finally {
            setJobs((prev) =>
              prev.map((j) =>
                j.name === job.name && j.namespace === job.namespace
                  ? { ...j, triggeringAll: false }
                  : j
              )
            );
            loadJobs();
          }
        };

        useEffect(() => {
          fetch(BASE + "/api/v1/auth/status")
            .then((res) => res.json())
            .then((data) => setAuthInfo(data))
            .catch(() => {});

          fetch(BASE + "/api/v1/version")
            .then((res) => res.json())
            .then((data) => setVersion(data.version))
            .catch(() => {});
        }, []);

        useEffect(() => {
          loadJobs();
          const interval = setInterval(loadJobs, 30000);
          return () => clearInterval(interval);
        }, [loadJobs]);

        // A fresh install (no jobs at all) is sent to the dedicated /setup
        // page outright; once jobs exist the dashboard stays usable and a
        // slim banner links back until setup is finished. The
        // misconfiguration banner outranks both: nothing else is
        // trustworthy in that state.
        const setupIncomplete =
          !!setupStatus?.visible &&
          !setupStatus.complete &&
          !setupGuideDismissed &&
          !loading &&
          !error &&
          !accessStatus?.misconfigured;
        const goToSetup = setupIncomplete && jobs.length === 0;

        useEffect(() => {
          if (goToSetup) {
            window.location.replace(withBase("/setup"));
          }
        }, [goToSetup]);

        return (
          <div className="min-h-screen flex flex-col">
            <ToastContainer toasts={toasts} onRemove={removeToast} />

            {/* Brand strip only — everything the user filters and searches with
                lives in the sticky toolbar below, so it stays reachable while
                scrolling through the job cards. */}
            <SiteHeader version={version} authInfo={authInfo} hasBottomMargin={false} />

            <StickyToolbar testId="dashboard-toolbar">
              {/* One scrollable row rather than a wrapping grid: the toolbar has to
                  stay short enough that it does not eat the viewport it is pinned to. */}
              <div className="flex items-center gap-2 overflow-x-auto -mx-1 px-1 py-1">
                <StatBadge
                  label="All"
                  value={loading ? "—" : stats.total}
                  onClick={clearStatFilter}
                  selected={!selectedStatFilter}
                  title="Show all projects"
                />
                <StatBadge
                  label="Failed"
                  value={loading ? "—" : stats.failed}
                  valueClass="text-error"
                  onClick={() => toggleStatFilter("failed")}
                  selected={selectedStatFilter === "failed"}
                  title="Show only jobs with failed projects"
                />
                <StatBadge
                  label="Scheduled"
                  value={loading ? "—" : stats.scheduled}
                  valueClass="text-warning"
                  onClick={() => toggleStatFilter("scheduled")}
                  selected={selectedStatFilter === "scheduled"}
                  title="Show only jobs with scheduled projects"
                />
                <StatBadge
                  label="Running"
                  value={loading ? "—" : stats.running}
                  valueClass="text-primary"
                  onClick={() => toggleStatFilter("running")}
                  selected={selectedStatFilter === "running"}
                  title="Show only jobs with running projects"
                />
                <StatBadge
                  label="Completed"
                  value={loading ? "—" : stats.completed}
                  valueClass="text-success"
                  onClick={() => toggleStatFilter("completed")}
                  selected={selectedStatFilter === "completed"}
                  title="Show only jobs with completed projects"
                />
                <StatBadge
                  label="Open PRs"
                  value={loading ? "—" : stats.openPRs}
                  valueClass="text-blue-500"
                  borderClass="border-blue-200 dark:border-blue-700"
                  onClick={() => toggleStatFilter("openPRs")}
                  selected={selectedStatFilter === "openPRs"}
                  title="Show only jobs with open pull requests or merge requests"
                />
                <StatBadge
                  label="Pending"
                  value={loading ? "—" : stats.pending}
                  valueClass="text-orange-500"
                  borderClass="border-orange-200 dark:border-orange-700"
                  onClick={() => toggleStatFilter("pending")}
                  selected={selectedStatFilter === "pending"}
                  title="Show only jobs with updates awaiting approval"
                />
                <StatBadge
                  label="With Issues"
                  value={loading ? "—" : stats.withIssues}
                  valueClass="text-amber-500"
                  borderClass="border-amber-300 dark:border-amber-600"
                  onClick={() => toggleStatFilter("withIssues")}
                  selected={selectedStatFilter === "withIssues"}
                  title="Show only jobs with warnings or errors"
                />
              </div>

              {(!loading || jobs.length > 0) && (
                <div className="flex items-center gap-2">
                  <label htmlFor="project-search" className="sr-only">Search projects</label>
                  <div className="relative flex-1 min-w-0">
                    <div className="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                      <svg className="h-4 w-4 text-gray-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                      </svg>
                    </div>
                    <input
                      id="project-search"
                      type="search"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Escape") clearSearch(); }}
                      placeholder="Search projects…"
                      className="block w-full rounded-lg border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 py-1.5 pl-9 pr-9 text-sm text-gray-900 dark:text-slate-100 placeholder:text-gray-400 dark:placeholder:text-slate-500 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary"
                      aria-label="Search projects by name"
                    />
                    {searchTerm && (
                      <button
                        type="button"
                        onClick={clearSearch}
                        className="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 dark:hover:text-slate-300 transition-colors"
                        aria-label="Clear search"
                      >
                        <svg className="h-4 w-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                          <path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clipRule="evenodd" />
                        </svg>
                      </button>
                    )}
                  </div>
                  {searchFilteredJobs.length > 1 && (
                    <div className="flex items-center gap-2 shrink-0">
                      <button
                        type="button"
                        onClick={expandAllJobs}
                        disabled={expandedVisibleJobCount === searchFilteredJobs.length}
                        className="px-3 py-1.5 text-sm font-medium rounded-lg border border-gray-200 dark:border-slate-700 text-gray-600 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-700/50 hover:text-primary dark:hover:text-primary transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-gray-600 dark:disabled:hover:text-slate-300"
                        aria-label="Expand all job cards"
                      >
                        {/* The short label keeps the search box usable on a phone,
                            where this row has to share one line with it. */}
                        <span className="sm:hidden">Expand</span>
                        <span className="hidden sm:inline">Expand all</span>
                      </button>
                      <button
                        type="button"
                        onClick={collapseAllJobs}
                        disabled={expandedVisibleJobCount === 0}
                        className="px-3 py-1.5 text-sm font-medium rounded-lg border border-gray-200 dark:border-slate-700 text-gray-600 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-700/50 hover:text-primary dark:hover:text-primary transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-gray-600 dark:disabled:hover:text-slate-300"
                        aria-label="Collapse all job cards"
                      >
                        <span className="sm:hidden">Collapse</span>
                        <span className="hidden sm:inline">Collapse all</span>
                      </button>
                    </div>
                  )}
                </div>
              )}
            </StickyToolbar>

            <main className="flex-1 max-w-7xl mx-auto w-full px-3 sm:px-6 lg:px-8 pt-4 sm:pt-6 pb-6 sm:pb-8">
              {accessStatus?.misconfigured && (
                <div
                  role="alert"
                  data-testid="access-misconfigured"
                  className="mb-6 rounded-lg bg-error/10 border-2 border-error/40 p-4 sm:p-6"
                >
                  <div className="flex items-start gap-3">
                    <svg
                      className="w-6 h-6 text-error flex-shrink-0"
                      fill="currentColor"
                      viewBox="0 0 20 20"
                      aria-hidden="true"
                    >
                      <path
                        fillRule="evenodd"
                        d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
                        clipRule="evenodd"
                      />
                    </svg>
                    <div className="min-w-0">
                      <h3 className="text-base sm:text-lg font-semibold text-error">
                        Access rules cannot be enforced
                      </h3>
                      <p className="mt-1 text-sm text-gray-700 dark:text-slate-300 break-words">
                        {accessStatus.message}
                      </p>
                    </div>
                  </div>
                </div>
              )}

              {accessStatus?.warning && !accessStatus?.misconfigured && (
                <div
                  role="alert"
                  data-testid="access-warning"
                  className="mb-6 rounded-lg bg-warning/10 border border-warning/30 p-4 sm:p-6"
                >
                  <div className="flex items-start gap-3">
                    <svg
                      className="w-6 h-6 text-warning flex-shrink-0"
                      fill="currentColor"
                      viewBox="0 0 20 20"
                      aria-hidden="true"
                    >
                      <path
                        fillRule="evenodd"
                        d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
                        clipRule="evenodd"
                      />
                    </svg>
                    <div className="min-w-0">
                      <h3 className="text-base sm:text-lg font-semibold text-warning">
                        Some RenovateJobs grant no one access
                      </h3>
                      <p className="mt-1 text-sm text-gray-700 dark:text-slate-300 break-words">
                        {accessStatus.warning.message}
                      </p>
                    </div>
                  </div>
                </div>
              )}

              {loading && jobs.length === 0 && (
                <div className="space-y-6">
                  <div className="bg-white dark:bg-slate-800 rounded-lg p-6 border border-gray-200 dark:border-slate-700 shadow-sm animate-pulse">
                    <div className="h-8 bg-gradient-to-r from-gray-200 via-gray-100 to-gray-200 dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 bg-[length:200%_100%] rounded-lg mb-4 skeleton-header"></div>
                    <div className="flex flex-col gap-3">
                      <div className="h-4 bg-gradient-to-r from-gray-200 via-gray-100 to-gray-200 dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 bg-[length:200%_100%] rounded skeleton-line"></div>
                      <div className="h-4 bg-gradient-to-r from-gray-200 via-gray-100 to-gray-200 dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 bg-[length:200%_100%] rounded skeleton-line"></div>
                      <div className="h-4 bg-gradient-to-r from-gray-200 via-gray-100 to-gray-200 dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 bg-[length:200%_100%] rounded skeleton-line"></div>
                    </div>
                  </div>
                  <div className="bg-white dark:bg-slate-800 rounded-lg p-6 border border-gray-200 dark:border-slate-700 shadow-sm animate-pulse">
                    <div className="h-8 bg-gradient-to-r from-gray-200 via-gray-100 to-gray-200 dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 bg-[length:200%_100%] rounded-lg mb-4 skeleton-header"></div>
                    <div className="flex flex-col gap-3">
                      <div className="h-4 bg-gradient-to-r from-gray-200 via-gray-100 to-gray-200 dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 bg-[length:200%_100%] rounded skeleton-line"></div>
                      <div className="h-4 bg-gradient-to-r from-gray-200 via-gray-100 to-gray-200 dark:from-slate-700 dark:via-slate-600 dark:to-slate-700 bg-[length:200%_100%] rounded skeleton-line"></div>
                    </div>
                  </div>
                </div>
              )}

              {error && !loading && (
                <div className="bg-error/10 border border-error/20 rounded-lg p-6 text-center">
                  <svg
                    className="w-12 h-12 text-error mx-auto mb-4"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                    aria-hidden="true"
                  >
                    <path
                      fillRule="evenodd"
                      d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                      clipRule="evenodd"
                    />
                  </svg>
                  <h3 className="text-lg font-semibold text-error mb-2">
                    Failed to load jobs
                  </h3>
                  <p className="text-gray-600 dark:text-slate-400 mb-4">{error}</p>
                  <button
                    onClick={loadJobs}
                    className="px-3 py-1.5 text-sm bg-primary hover:bg-primary-hover text-white rounded-lg transition-colors"
                    aria-label="Retry loading jobs"
                  >
                    Retry
                  </button>
                </div>
              )}

              {setupIncomplete && jobs.length > 0 && (
                <a
                  href={withBase("/setup")}
                  data-testid="setup-banner"
                  className="mb-6 flex items-center justify-between gap-3 rounded-lg border border-primary/20 bg-primary/5 dark:bg-primary/10 px-4 py-3 hover:border-primary/40 transition-colors"
                >
                  <p className="text-sm text-gray-700 dark:text-slate-300">
                    Setup is not finished yet — some steps still need your attention.
                  </p>
                  <span className="text-sm font-semibold text-primary whitespace-nowrap">
                    Continue setup →
                  </span>
                </a>
              )}

              {/* The misconfiguration banner already explains an empty list, and
                  its advice outranks the sign-in prompt this would show. A fresh
                  install is redirected to /setup instead of seeing this. */}
              {!loading && !error && jobs.length === 0 && !accessStatus?.misconfigured && !goToSetup && (
                <div className="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-lg p-6 text-center">
                  <h3 className="text-lg font-semibold text-gray-900 dark:text-slate-100 mb-2">
                    No RenovateJobs visible
                  </h3>
                  <p className="text-gray-600 dark:text-slate-400 mb-4">
                    {authInfo && authInfo.enabled && !authInfo.authenticated
                      ? "Sign in to see the jobs your account grants access to."
                      : "Either no RenovateJob exists yet, or none of them grant your account access."}
                  </p>
                  {authInfo && authInfo.enabled && !authInfo.authenticated && (
                    <a
                      href={`${BASE}/auth/login`}
                      className="inline-block px-4 py-2 bg-primary hover:bg-primary-hover text-white rounded-lg transition-colors"
                    >
                      Sign in
                    </a>
                  )}
                </div>
              )}

              {(!loading || jobs.length > 0) && (
                <div className="space-y-6">
                  {(selectedStatFilter || searchTerm.trim()) && (
                    <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between rounded-lg border border-primary/20 bg-primary/5 dark:bg-primary/10 px-4 py-3">
                      <p className="text-sm text-gray-700 dark:text-slate-300">
                        Showing{" "}
                        <span className="font-semibold text-primary">{searchFilteredProjectCount}</span>{" "}
                        project{searchFilteredProjectCount === 1 ? "" : "s"} in{" "}
                        <span className="font-semibold text-primary">{searchFilteredJobs.length}</span>{" "}
                        job{searchFilteredJobs.length === 1 ? "" : "s"}
                        {selectedStatFilter && (
                          <>{" "}with status <span className="font-semibold text-primary">{STAT_FILTER_LABELS[selectedStatFilter]}</span></>
                        )}
                        {searchTerm.trim() && (
                          <>{" "}matching <span className="font-semibold">"{searchTerm.trim()}"</span></>
                        )}
                      </p>
                      <div className="flex items-center gap-3 self-start sm:self-auto">
                        {searchTerm.trim() && (
                          <button
                            type="button"
                            onClick={clearSearch}
                            className="text-sm font-medium text-primary hover:text-primary-hover transition-colors"
                          >
                            Clear search
                          </button>
                        )}
                        {selectedStatFilter && (
                          <button
                            type="button"
                            onClick={clearStatFilter}
                            className="text-sm font-medium text-primary hover:text-primary-hover transition-colors"
                          >
                            Clear filter
                          </button>
                        )}
                      </div>
                    </div>
                  )}

                  {searchFilteredJobs.map((job) => (
                    <JobCard
                      key={`${job.name}-${job.namespace}`}
                      job={job}
                      expanded={isJobCardExpanded(toggledJobCardKeys, jobStorageKey(job))}
                      onToggleExpanded={toggleJobCardExpansion}
                      onRunDiscovery={runDiscovery}
                      onTriggerRenovate={triggerRenovate}
                      onTriggerAllRenovate={triggerAllRenovate}
                      onCancelRenovate={cancelRenovate}
                      authInfo={authInfo}
                    />
                  ))}

                  {/* Only when a filter or search hid existing jobs: a genuinely
                      empty install is covered by the setup guide or the empty
                      state above, and this card would just repeat them. */}
                  {searchFilteredJobs.length === 0 && !loading && !error &&
                    (jobs.length > 0 || searchTerm.trim() || selectedStatFilter) && (
                    <div className="text-center py-12 bg-white dark:bg-slate-800 rounded-lg border border-gray-200 dark:border-slate-700 shadow-sm">
                      <svg
                        className="w-16 h-16 text-gray-400 mx-auto mb-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                      >
                        <path
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          strokeWidth="2"
                          d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"
                        />
                      </svg>
                      <h3 className="text-lg font-semibold text-gray-700 dark:text-slate-300 mb-2">
                        {searchTerm.trim()
                          ? "No projects match your search"
                          : selectedStatFilter
                          ? "No jobs match this filter"
                          : "No Renovate Jobs Found"}
                      </h3>
                      <p className="text-gray-500 dark:text-slate-400 mb-4">
                        {searchTerm.trim()
                          ? `No projects found matching "${searchTerm.trim()}".`
                          : selectedStatFilter
                          ? `Try clearing the ${STAT_FILTER_LABELS[selectedStatFilter]} filter to see all jobs again.`
                          : "Create a RenovateJob resource to get started."}
                      </p>
                      {(searchTerm.trim() || selectedStatFilter) && (
                        <div className="flex items-center justify-center gap-3">
                          {searchTerm.trim() && (
                            <button
                              type="button"
                              onClick={clearSearch}
                              className="px-3 py-1.5 text-sm bg-primary hover:bg-primary-hover text-white rounded-lg transition-colors"
                            >
                              Clear search
                            </button>
                          )}
                          {selectedStatFilter && (
                            <button
                              type="button"
                              onClick={clearStatFilter}
                              className="px-3 py-1.5 text-sm bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition-colors"
                            >
                              Clear filter
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
            </main>
            <Footer />
          </div>
        );
      }

      function getSortedProjects(projects, sortConfig) {
        if (!projects || projects.length === 0) {
          return [];
        }

        const sortedProjects = [...projects];

        if (sortConfig.key) {
          sortedProjects.sort((a, b) => {
            let aValue = a[sortConfig.key];
            let bValue = b[sortConfig.key];

            // Handle null/undefined values
            if (!aValue && !bValue) return 0;
            if (!aValue) return sortConfig.direction === "asc" ? 1 : -1;
            if (!bValue) return sortConfig.direction === "asc" ? -1 : 1;

            if (sortConfig.key === "status") {
              const statusOrder = {
                running: 0,
                scheduled: 1,
                failed: 2,
                completed: 3,
              };
              const aStatus = statusOrder[(a.status || "").toLowerCase()] ?? 99;
              const bStatus = statusOrder[(b.status || "").toLowerCase()] ?? 99;

              // Primary: status
              if (aStatus !== bStatus) {
                return sortConfig.direction === "asc"
                  ? aStatus - bStatus
                  : bStatus - aStatus;
              }

              // Secondary: onboarding state within same status
              const aHasConfig = a.renovateResultStatus && a.renovateResultStatus !== "done";
              const bHasConfig = b.renovateResultStatus && b.renovateResultStatus !== "done";
              const aOnboarding = aHasConfig ? 1 : 0;
              const bOnboarding = bHasConfig ? 1 : 0;

              if (aOnboarding !== bOnboarding) {
                return sortConfig.direction === "asc"
                  ? aOnboarding - bOnboarding
                  : bOnboarding - aOnboarding;
              }

              // Tertiary: name
              const aName = (a.name || "").toLowerCase();
              const bName = (b.name || "").toLowerCase();
              return aName.localeCompare(bName);
            }

            // Special handling for lastTransition (date comparison)
            if (sortConfig.key === "lastTransition") {
              aValue = new Date(aValue).getTime();
              bValue = new Date(bValue).getTime();
            }

            // String comparison
            if (typeof aValue === "string" && typeof bValue === "string") {
              return sortConfig.direction === "asc"
                ? aValue.localeCompare(bValue)
                : bValue.localeCompare(aValue);
            }

            // Numeric comparison
            if (aValue < bValue) {
              return sortConfig.direction === "asc" ? -1 : 1;
            }
            if (aValue > bValue) {
              return sortConfig.direction === "asc" ? 1 : -1;
            }
            return 0;
          });
        }

        return sortedProjects;
      };

      // Sanitize project name for use in HTML IDs (replace characters invalid in IDs like slashes)
      const safeId = (name) => name.replace(/[^a-zA-Z0-9_-]/g, '-');

      // Shared badge class for PR action types
      const prActionBadgeClass = (action) => {
        const base = "inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium whitespace-nowrap";
        switch (action) {
          case "automerged": return `${base} bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400 ring-1 ring-purple-300 dark:ring-purple-700`;
          case "created": return `${base} bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 ring-1 ring-green-300 dark:ring-green-700`;
          case "updated": return `${base} bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 ring-1 ring-amber-300 dark:ring-amber-700`;
          case "needs-approval": return `${base} bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400 ring-1 ring-orange-300 dark:ring-orange-700`;
          default: return `${base} bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400 ring-1 ring-gray-300 dark:ring-gray-600`;
        }
      };

      function PRActivityBadges({ prActivity, expanded, onToggle, projectName }) {
        if (!prActivity) return <span className="text-gray-400 dark:text-slate-500 text-sm">-</span>;

        const { automerged = 0, created = 0, updated = 0, needsApproval = 0, unchanged = 0 } = prActivity;
        if (!automerged && !created && !updated && !needsApproval && !unchanged) {
          return <span className="text-gray-400 dark:text-slate-500 text-sm">-</span>;
        }

        const hasPRs = prActivity.prs && prActivity.prs.length > 0;
        const badges = [];
        if (automerged > 0) badges.push(
          <span key="automerged" className={prActionBadgeClass("automerged")}>{automerged} automerged</span>
        );
        if (created > 0) badges.push(
          <span key="created" className={prActionBadgeClass("created")}>{created} created</span>
        );
        if (updated > 0) badges.push(
          <span key="updated" className={prActionBadgeClass("updated")}>{updated} updated</span>
        );
        if (needsApproval > 0) badges.push(
          <span key="needs-approval" className={prActionBadgeClass("needs-approval")}>{needsApproval} needs approval</span>
        );
        if (unchanged > 0) badges.push(
          <span key="unchanged" className={prActionBadgeClass("unchanged")}>{unchanged} unchanged</span>
        );

        const chevron = hasPRs ? (
          <svg
            className={`w-4 h-4 text-gray-400 dark:text-slate-500 transition-transform duration-200 ${expanded ? "rotate-180" : ""}`}
            fill="none" stroke="currentColor" viewBox="0 0 24 24"
          >
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
          </svg>
        ) : null;

        if (!hasPRs) {
          return <div className="flex items-center gap-1.5 flex-wrap">{badges}</div>;
        }

        return (
          <button
            onClick={(e) => { e.stopPropagation(); onToggle(); }}
            className="flex items-center gap-1.5 flex-wrap rounded-lg p-0.5 -m-0.5 cursor-pointer focus-visible:ring-2 focus-visible:ring-primary focus-visible:outline-none hover:opacity-80 transition-opacity"
            {...(expanded ? { "aria-expanded": true, "aria-controls": `pr-details-${safeId(projectName)}` } : { "aria-expanded": false })}
          >
            {badges}
            {chevron}
          </button>
        );
      }

      function PRDetailRow({ prActivity, projectName, platform, platformEndpoint }) {
        if (!prActivity || !prActivity.prs || prActivity.prs.length === 0) return null;

        return (
          <tr id={`pr-details-${safeId(projectName)}`}>
            <td colSpan="7" className="px-6 py-0">
              <div className="py-3 pl-4 border-l-2 border-gray-200 dark:border-slate-600 max-h-64 overflow-y-auto">
                <div className="space-y-1.5">
                  {prActivity.prs.map((pr, idx) => {
                    const prUrl = buildSinglePRUrl(platform, platformEndpoint, projectName, pr.number);
                    return (
                      <div key={idx} className="flex items-center gap-2 text-sm">
                        <span className={prActionBadgeClass(pr.action)}>{pr.action}</span>
                        {prUrl ? (
                          <a
                            href={prUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="text-primary hover:text-primary-hover hover:underline truncate"
                            title={pr.title || prUrl}
                          >
                            {pr.title || prUrl}
                          </a>
                        ) : (
                          <span className="text-gray-700 dark:text-slate-300 truncate" title={pr.title}>{pr.title || "Untitled PR"}</span>
                        )}
                        {pr.number && prUrl && (
                          <a href={prUrl} target="_blank" rel="noopener noreferrer" className="text-gray-400 dark:text-slate-500 hover:text-primary hover:dark:text-primary-hover text-xs flex-shrink-0">#{pr.number}</a>
                        )}
                        {pr.number && !prUrl && (
                          <span className="text-gray-400 dark:text-slate-500 text-xs flex-shrink-0">#{pr.number}</span>
                        )}
                      </div>
                    );
                  })}
                  {prActivity.truncated && (
                    <div className="text-xs text-gray-400 dark:text-slate-500 italic mt-1">
                      Some PRs omitted (list truncated)
                    </div>
                  )}
                </div>
              </div>
            </td>
          </tr>
        );
      }

      const issueLevelBadgeClass = (level) => {
        const base = "inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium whitespace-nowrap";
        if (level >= 50) return `${base} bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 ring-1 ring-red-300 dark:ring-red-700`;
        return `${base} bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 ring-1 ring-amber-300 dark:ring-amber-700`;
      };

      function IssuesBadges({ logIssues, expanded, onToggle, projectName }) {
        if (!logIssues || (logIssues.warnCount === 0 && logIssues.errorCount === 0)) {
          return <span className="text-gray-400 dark:text-slate-500 text-sm">-</span>;
        }

        const hasDetails = logIssues.issues && logIssues.issues.length > 0;
        const badges = [];
        if (logIssues.errorCount > 0) badges.push(
          <span key="error" className={issueLevelBadgeClass(50)}>{logIssues.errorCount} error{logIssues.errorCount !== 1 ? "s" : ""}</span>
        );
        if (logIssues.warnCount > 0) badges.push(
          <span key="warn" className={issueLevelBadgeClass(40)}>{logIssues.warnCount} warn{logIssues.warnCount !== 1 ? "s" : ""}</span>
        );

        const chevron = hasDetails ? (
          <svg
            className={`w-4 h-4 text-gray-400 dark:text-slate-500 transition-transform duration-200 ${expanded ? "rotate-180" : ""}`}
            fill="none" stroke="currentColor" viewBox="0 0 24 24"
          >
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
          </svg>
        ) : null;

        if (!hasDetails) {
          return <div className="flex items-center gap-1.5 flex-wrap">{badges}</div>;
        }

        return (
          <button
            onClick={(e) => { e.stopPropagation(); onToggle(); }}
            className="flex items-center gap-1.5 flex-wrap rounded-lg p-0.5 -m-0.5 cursor-pointer focus-visible:ring-2 focus-visible:ring-primary focus-visible:outline-none hover:opacity-80 transition-opacity"
            {...(expanded ? { "aria-expanded": true, "aria-controls": `issue-details-${safeId(projectName)}` } : { "aria-expanded": false })}
          >
            {badges}
            {chevron}
          </button>
        );
      }

      function issueLogsHref(jobName, jobNamespace, projectName, level) {
        const levels = level >= 50 ? "ERROR,FATAL" : "WARN";
        return `${BASE}/logs?renovate=${encodeURIComponent(jobName)}&namespace=${encodeURIComponent(jobNamespace)}&project=${encodeURIComponent(projectName)}&levels=${levels}`;
      }

      // Backend truncates issue messages at 256 bytes and appends "…". Older CRD-stored
      // messages predating that change lack the suffix, so render one when the length
      // indicates truncation and none is present.
      const ISSUE_MESSAGE_LIMIT = 256;
      function displayIssueMessage(msg) {
        if (!msg) return "";
        if (msg.endsWith("…")) return msg;
        if (msg.length >= ISSUE_MESSAGE_LIMIT) return msg + "…";
        return msg;
      }

      function IssueDetailRow({ logIssues, projectName, jobName, jobNamespace }) {
        if (!logIssues || !logIssues.issues || logIssues.issues.length === 0) return null;

        return (
          <tr id={`issue-details-${safeId(projectName)}`}>
            <td colSpan="7" className="px-6 py-0">
              <div className="py-3 pl-4 border-l-2 border-amber-300 dark:border-amber-600 max-h-64 overflow-y-auto">
                <div className="space-y-1.5">
                  {logIssues.issues.map((issue, idx) => (
                    <a
                      key={idx}
                      href={issueLogsHref(jobName, jobNamespace, projectName, issue.level)}
                      target="_blank"
                      rel="noopener"
                      className="group flex items-start gap-2 text-sm rounded-md hover:bg-amber-50 dark:hover:bg-amber-900/20 -mx-1 px-1 py-0.5 transition-colors"
                      title="Open full message in logs"
                    >
                      <span className={`flex-shrink-0 ${issueLevelBadgeClass(issue.level)}`}>{issue.level >= 50 ? "error" : "warn"}</span>
                      <span className="text-gray-700 dark:text-slate-300 break-all">
                        {displayIssueMessage(issue.message)}
                        <span className="inline-flex items-center gap-0.5 ml-1.5 text-primary hover:underline whitespace-nowrap">
                          View in logs
                          <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                          </svg>
                        </span>
                      </span>
                    </a>
                  ))}
                  {logIssues.truncated && (
                    <div className="text-xs text-gray-400 dark:text-slate-500 italic mt-1">
                      Some issues omitted (list truncated)
                    </div>
                  )}
                </div>
              </div>
            </td>
          </tr>
        );
      }

      function BugIcon({ className }) {
        return (
          <svg className={className} fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 8h-2.81c-.45-.78-1.07-1.45-1.82-1.96L17 4.41 15.59 3l-2.17 2.17C12.96 5.06 12.49 5 12 5c-.49 0-.96.06-1.41.17L8.41 3 7 4.41l1.62 1.63C7.88 6.55 7.26 7.22 6.81 8H4v2h2.09c-.05.33-.09.66-.09 1v1H4v2h2v1c0 .34.04.67.09 1H4v2h2.81c1.04 1.79 2.97 3 5.19 3s4.15-1.21 5.19-3H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-6 8h-4v-2h4v2zm0-4h-4v-2h4v2z"/>
          </svg>
        );
      }

      function ActionButton({ project, onTrigger, onTriggerDebug, onCancel, width, jobAccepted, canTrigger = true, canCancel = true, hint }) {
        const isRunning = project.status === "running";
        const isScheduled = project.status === "scheduled";
        const isPrioritized = isScheduled && (project.priority || 0) > 0;
        const isTriggering = !!project.triggering;
        const isCancelling = !!project.cancelling;
        const isDebugScheduled = isScheduled && !!project.executionOptions?.debug;

        if (isRunning) {
          return (
            <button
              onClick={onCancel}
              disabled={isCancelling || !canCancel}
              title={canCancel ? undefined : hint}
              className={`bg-error hover:bg-red-700 disabled:opacity-60 disabled:cursor-not-allowed text-white px-3 py-1.5 rounded-lg font-semibold text-[0.813rem] shadow-sm hover:shadow-md transition-all inline-flex items-center justify-center gap-1.5 ${width || ""}`}
              aria-label={isCancelling ? "Cancelling renovate" : `Cancel renovate for ${project.name}`}
            >
              {isCancelling && <Spinner />}
              <span>{isCancelling ? "Cancelling..." : "Cancel"}</span>
            </button>
          );
        }

        const label = isTriggering
          ? "Triggering..."
          : isPrioritized
          ? "Prioritized"
          : isScheduled
          ? "Prioritize"
          : "Trigger";

        // Why the controls are dead, if they are: a policy halt outranks a
        // missing permission, since fixing the policy is the prerequisite.
        const blocked = !jobAccepted
          ? "Halted by the operator's policy"
          : !canTrigger
          ? hint
          : undefined;

        return (
          <div className={`flex items-stretch shadow-sm rounded-lg overflow-hidden ${width || ""}`}>
            <button
              onClick={onTrigger}
              disabled={isTriggering || isPrioritized || !!blocked}
              title={blocked}
              className="flex-1 bg-primary hover:bg-primary-hover disabled:opacity-60 disabled:cursor-not-allowed text-white px-3 py-1.5 font-semibold text-[0.813rem] transition-all inline-flex items-center justify-center gap-1.5"
              aria-label={
                blocked
                  ? blocked
                  : isTriggering
                  ? "Triggering renovate"
                  : isPrioritized
                  ? `Renovate already prioritized for ${project.name}`
                  : isScheduled
                  ? `Prioritize renovate for ${project.name}`
                  : `Trigger renovate for ${project.name}`
              }
            >
              {isTriggering && <Spinner />}
              {label}
            </button>
            <button
              onClick={onTriggerDebug}
              disabled={isTriggering || !!blocked}
              title={blocked || "Trigger in debug mode"}
              className={`${isDebugScheduled ? "bg-amber-600 text-white" : "bg-gray-600 text-amber-400"} hover:bg-amber-600 disabled:opacity-60 disabled:cursor-not-allowed hover:text-white px-2 py-1.5 text-[0.813rem] transition-all border-l border-white/10`}
              aria-label={blocked || `Trigger ${project.name} in debug mode`}
            >
              <BugIcon className="w-3.5 h-3.5" />
            </button>
          </div>
        );
      }

      // Brand marks (simple-icons paths) keyed by the platform values Renovate
      // accepts. GitHub deliberately carries no color class so it inherits the
      // header text color; the rest keep their brand color in both themes.
      const PROVIDER_LOGOS = {
        github: {
          label: "GitHub",
