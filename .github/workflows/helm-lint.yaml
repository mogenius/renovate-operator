name: Helm

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: mogenius/github-actions/.github/workflows/helm-lint.yml@8c32f9928164b14c8856b40cdda5825d60236726 # v1.16.1
    with:
      path: ./charts/renovate-operator

  tests:
    uses: mogenius/github-actions/.github/workflows/helm-unittest.yml@8c32f9928164b14c8856b40cdda5825d60236726 # v1.16.1
    with:
      path: ./charts/renovate-operator


  template:
    uses: mogenius/github-actions/.github/workflows/helm-template.yml@8c32f9928164b14c8856b40cdda5825d60236726 # v1.16.1
    with:
      path: ./charts/renovate-operator
      namespace: renovate-operator
      update_dependencies: true
      values: |
        metrics:
          dashboard:
            enabled: true
