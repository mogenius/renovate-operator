name: Helm

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: mogenius/github-actions/.github/workflows/helm-lint.yml@e375ba30acf0eca00d70f355e3d11ed884c66b15 # v1.10.4
    with:
      path: ./charts/renovate-operator

  tests:
    uses: mogenius/github-actions/.github/workflows/helm-unittest.yml@e375ba30acf0eca00d70f355e3d11ed884c66b15 # v1.10.4
    with:
      path: ./charts/renovate-operator


  template:
    uses: mogenius/github-actions/.github/workflows/helm-template.yml@e375ba30acf0eca00d70f355e3d11ed884c66b15 # v1.10.4
    with:
      path: ./charts/renovate-operator
      namespace: renovate-operator
      update_dependencies: true
      values: |
        metrics:
          dashboard:
            enabled: true
