name: Helm

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: mogenius/github-actions/.github/workflows/helm-lint.yml@42a618fc6a3360f2856da4f3400ca63fd72caa74 # v1.10.1
    with:
      path: ./charts/renovate-operator

  tests:
    uses: mogenius/github-actions/.github/workflows/helm-unittest.yml@42a618fc6a3360f2856da4f3400ca63fd72caa74 # v1.10.1
    with:
      path: ./charts/renovate-operator


  template:
    uses: mogenius/github-actions/.github/workflows/helm-template.yml@42a618fc6a3360f2856da4f3400ca63fd72caa74 # v1.10.1
    with:
      path: ./charts/renovate-operator
      namespace: renovate-operator
      update_dependencies: true
      values: |
        metrics:
          dashboard:
            enabled: true
