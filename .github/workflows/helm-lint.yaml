name: Helm

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: mogenius/github-actions/.github/workflows/helm-lint.yml@c67a630f9cb0aa11a4573a9f12438bf7e5e203eb # v1.15.0
    with:
      path: ./charts/renovate-operator

  tests:
    uses: mogenius/github-actions/.github/workflows/helm-unittest.yml@c67a630f9cb0aa11a4573a9f12438bf7e5e203eb # v1.15.0
    with:
      path: ./charts/renovate-operator


  template:
    uses: mogenius/github-actions/.github/workflows/helm-template.yml@c67a630f9cb0aa11a4573a9f12438bf7e5e203eb # v1.15.0
    with:
      path: ./charts/renovate-operator
      namespace: renovate-operator
      update_dependencies: true
      values: |
        metrics:
          dashboard:
            enabled: true
