name: Helm

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: mogenius/github-actions/.github/workflows/helm-lint.yml@24e7c2cfc24de271da3425a92db9303355518a5e # v1.14.1
    with:
      path: ./charts/renovate-operator

  tests:
    uses: mogenius/github-actions/.github/workflows/helm-unittest.yml@24e7c2cfc24de271da3425a92db9303355518a5e # v1.14.1
    with:
      path: ./charts/renovate-operator


  template:
    uses: mogenius/github-actions/.github/workflows/helm-template.yml@24e7c2cfc24de271da3425a92db9303355518a5e # v1.14.1
    with:
      path: ./charts/renovate-operator
      namespace: renovate-operator
      update_dependencies: true
      values: |
        metrics:
          dashboard:
            enabled: true
