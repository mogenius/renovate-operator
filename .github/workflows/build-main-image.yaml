
name: Build main Image

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-operator:
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@c3e043d602a88fea39b680b67480b4a90d8d31d2 # v1.8.0
    secrets: inherit
    with:
      version: "main"
      image: ghcr.io/mogenius/renovate-operator
      push_latest: false
