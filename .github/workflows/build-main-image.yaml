
name: Build main Image

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-operator:
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@42a618fc6a3360f2856da4f3400ca63fd72caa74 # v1.10.1
    secrets: inherit
    with:
      version: "main"
      image: ghcr.io/mogenius/renovate-operator
      push_latest: false
