
name: Build main Image

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-operator:
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@f17db5c42b9390bde81a6c5752fbc32cbcff677a # v1.8.5
    secrets: inherit
    with:
      version: "main"
      image: ghcr.io/mogenius/renovate-operator
      push_latest: false
