
name: Build main Image

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-operator:
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@b768adfe1456612b78e91b4f92425e37e231344f # v1.13.4
    secrets: inherit
    with:
      version: "main"
      image: ghcr.io/mogenius/renovate-operator
      push_latest: false
