name: Build, Package, Release (Production)

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

env:
  REGISTRY: ghcr.io
  HELMNAME: "renovate-operator"

jobs:
  build-operator:
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@21c1d9b81bf90ab1435ca5369ea700e96371c966 # v1.8.6
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      image: ghcr.io/mogenius/renovate-operator
      push_latest: true

  helm-chart:
    needs: [build-operator]
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          repositories: |
            helm-charts
            renovate-operator
          owner: mogenius
          permission-contents: write

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=1.23.2"

      - name: Update Chart.yaml
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" charts/renovate-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: ${VERSION}/" charts/renovate-operator/Chart.yaml

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          chart-search-root: charts/renovate-operator

      - name: Generate CRDs
        run: |
          export GOPATH=$(go env GOPATH)
          export PATH=$PATH:$GOPATH/bin
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@latest
          controller-gen crd paths=./src/... output:crd:dir=charts/renovate-operator/crd

      - name: Add Helm repositories
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Package chart
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          helm dependency build ./charts/renovate-operator
          helm package -d /tmp/ ./charts/renovate-operator --version "${VERSION}" --app-version "${VERSION}"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Pages
        env:
          VERSION: ${{ github.ref_name }}
          TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${TOKEN}@github.com/mogenius/helm-charts.git" \
            /tmp/helm-charts-repo

          cp "/tmp/${HELMNAME}-${VERSION}.tgz" /tmp/helm-charts-repo/public/

          cd /tmp/helm-charts-repo
          helm repo index public --url https://helm.mogenius.com/public --merge public/index.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git commit -m "chore: publish ${HELMNAME}-${VERSION}"

          for attempt in $(seq 1 5); do
            if git push; then
              echo "::notice::Published ${HELMNAME}-${VERSION} to public"
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "::error::Failed to push after 5 attempts"
              exit 1
            fi
            echo "::warning::Push conflict (attempt ${attempt}/5), retrying..."
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            cp "/tmp/${HELMNAME}-${VERSION}.tgz" public/
            helm repo index public --url https://helm.mogenius.com/public --merge public/index.yaml
            git add public/
            git commit -m "chore: publish ${HELMNAME}-${VERSION}"
            sleep $((attempt * 2))
          done

      - name: Push to OCI and sign
        env:
          VERSION: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHART_DIGEST=$(helm push "/tmp/${HELMNAME}-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/helm-charts" 2>&1 | grep "Digest: sha256:" | awk '{print $2}')

          if [ -z "${CHART_DIGEST}" ]; then
            echo "Failed to extract chart digest"
            exit 1
          fi
          echo "Chart digest: ${CHART_DIGEST}"

          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/helm-charts/${HELMNAME}@${CHART_DIGEST}"

      - name: Commit version and docs update
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git add charts/renovate-operator/Chart.yaml
          git add charts/renovate-operator/crd/*.mogenius.com_*.yaml
          git add charts/renovate-operator/README.md || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update Chart.yaml and documentation for version ${VERSION} [skip ci]"
          git pull --rebase
          git push origin main
