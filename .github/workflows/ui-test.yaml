name: UI browser tests

on:
  push:
    branches:
      - release-please--branches--main
  pull_request:
    branches:
      - main
    paths:
      - 'src/static/**'
      - 'tests/ui/**'
      - 'Justfile'
      - '.github/workflows/ui-test.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ui:
    runs-on: self-hosted
    # A browser launch hang (e.g. a Docker image / @playwright/test version
    # mismatch) must fail fast instead of tying up the self-hosted runner.
    timeout-minutes: 10
    # Ships Chromium and its OS libraries pre-baked. Keep the tag in lockstep with
    # @playwright/test in tests/ui/package.json — a mismatch fails at startup.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      # Containers default to a 64 MB /dev/shm, which Chromium can exhaust and
      # then hang on. Cheaper and narrower than Playwright's --ipc=host advice.
      options: --shm-size=1g
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # `just test-ui` also runs `jsInstall`, which fetches the Tailwind, Babel,
      # React and Floating UI bundles that index.html loads. They are gitignored,
      # so a fresh checkout renders a blank page without it.
      - name: Run the browser tests
        run: just test-ui

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            tests/ui/playwright-report/
            tests/ui/test-results/
          retention-days: 7
