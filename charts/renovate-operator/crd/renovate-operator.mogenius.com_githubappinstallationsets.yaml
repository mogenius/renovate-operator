---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: githubappinstallationsets.renovate-operator.mogenius.com
spec:
  group: renovate-operator.mogenius.com
  names:
    kind: GitHubAppInstallationSet
    listKind: GitHubAppInstallationSetList
    plural: githubappinstallationsets
    shortNames:
    - gais
    singular: githubappinstallationset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GitHubAppInstallationSet generates one RenovateJob per installation of a
          GitHub App, each inheriting its configuration from spec.templateRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GitHubAppInstallationSetSpec defines the desired state of
              a GitHubAppInstallationSet.
            properties:
              app:
                description: |-
                  Secret holding the GitHub App's id and private key. The Secret must carry
                  the renovate-operator.mogenius.com/allow-ref label once the policy engine
                  is enabled.
                properties:
                  appIdSecretKey:
                    minLength: 1
                    type: string
                  pemSecretKey:
                    minLength: 1
                    type: string
                  secretName:
                    minLength: 1
                    type: string
                required:
                - appIdSecretKey
                - pemSecretKey
                - secretName
                type: object
              installations:
                description: |-
                  Narrows which installations get a RenovateJob. Every installation of
                  the App matches when unset.
                properties:
                  accountTypes:
                    description: Account types to include. Every type matches when
                      empty.
                    items:
                      enum:
                      - User
                      - Organization
                      type: string
                    type: array
                  exclude:
                    description: Account logins to exclude. Takes precedence over
                      include.
                    items:
                      type: string
                    type: array
                  include:
                    description: Account logins to include. Every account matches
                      when empty.
                    items:
                      type: string
                    type: array
                type: object
              provider:
                description: |-
                  GitHub API endpoints. Defaults to https://api.github.com; set it for
                  GitHub Enterprise Server. Copied to the provider of every generated
                  RenovateJob.
                properties:
                  endpoint:
                    description: |-
                      GitHub API base URL. Its host must be listed in the operator's
                      policy.allowedHosts.
                    pattern: ^https?://[^?#]+$
                    type: string
                  publicEndpoint:
                    description: |-
                      Externally reachable URL used for UI links. Its host must be listed in
                      the operator's policy.allowedHosts.
                    pattern: ^https?://[^?#]+$
                    type: string
                type: object
              resyncInterval:
                default: 10m
                description: How often the installations are listed from the GitHub
                  API.
                type: string
                x-kubernetes-validations:
                - message: resyncInterval must be at least 1m
                  rule: duration(self) >= duration('1m')
              templateRef:
                description: |-
                  Template every generated RenovateJob inherits its configuration from.
                  The operator sets provider and githubAppReference on each generated
                  RenovateJob, so the template's values for those are overridden.
                properties:
                  kind:
                    default: RenovateJobTemplate
                    description: Kind of the referenced template. Defaults to RenovateJobTemplate.
                    enum:
                    - RenovateJobTemplate
                    - ClusterRenovateJobTemplate
                    type: string
                  name:
                    description: Name of the referenced template.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              webhook:
                description: |-
                  Resyncs immediately when GitHub delivers an installation or
                  installation_repositories event to the operator's /webhook/v1/github
                  endpoint.
                properties:
                  enabled:
                    type: boolean
                  secretRef:
                    description: |-
                      Secret key holding the GitHub App's webhook secret, used to verify the
                      X-Hub-Signature-256 header. The Secret must carry the
                      renovate-operator.mogenius.com/allow-ref label once the policy engine is
                      enabled.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    type: object
                required:
                - enabled
                type: object
                x-kubernetes-validations:
                - message: secretRef is required when the webhook is enabled
                  rule: '!self.enabled || has(self.secretRef)'
            required:
            - app
            - templateRef
            type: object
          status:
            description: GitHubAppInstallationSetStatus defines the observed state
              of a GitHubAppInstallationSet.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              installations:
                description: Installations matching the filter as of the last successful
                  sync.
                items:
                  description: |-
                    GitHubAppInstallationStatus records one installation and the RenovateJob
                    generated for it.
                  properties:
                    account:
                      type: string
                    accountType:
                      type: string
                    id:
                      format: int64
                      type: integer
                    renovateJob:
                      description: Name of the generated RenovateJob. Empty until
                        it has been created.
                      type: string
                    suspended:
                      description: |-
                        True when the installation is suspended on GitHub. Its RenovateJob is
                        suspended too, since no token can be minted for it.
                      type: boolean
                  required:
                  - account
                  - accountType
                  - id
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              lastSyncTime:
                description: Time of the last successful listing of installations.
                format: date-time
                type: string
              observedGeneration:
                description: Generation of the spec the last successful sync used.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
