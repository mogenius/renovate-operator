chart:
  appVersion: 0.1.0
  version: 0.1.0
suite: S3 credential secret keys
release:
  name: renovate-operator-unittest
  namespace: testing
templates:
- templates/deployment.yaml
tests:
- it: Defaults S3 credential secret keys to access-key-id and secret-access-key
  set:
    s3:
      bucket: my-bucket
      existingSecret: my-s3-secret
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: my-s3-secret
            key: access-key-id
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: my-s3-secret
            key: secret-access-key
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_ACCESS_KEY_ID_SECRET_KEY
        value: "access-key-id"
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_SECRET_ACCESS_KEY_SECRET_KEY
        value: "secret-access-key"

- it: Uses custom S3 credential secret keys
  set:
    s3:
      bucket: my-bucket
      existingSecret: my-s3-secret
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: my-s3-secret
            key: AWS_ACCESS_KEY_ID
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: my-s3-secret
            key: AWS_SECRET_ACCESS_KEY
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_ACCESS_KEY_ID_SECRET_KEY
        value: "AWS_ACCESS_KEY_ID"
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_SECRET_ACCESS_KEY_SECRET_KEY
        value: "AWS_SECRET_ACCESS_KEY"

- it: Falls back to defaults when credential secret keys are empty strings
  set:
    s3:
      bucket: my-bucket
      existingSecret: my-s3-secret
      accessKeyIdKey: ""
      secretAccessKeyKey: ""
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: my-s3-secret
            key: access-key-id
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: my-s3-secret
            key: secret-access-key
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_ACCESS_KEY_ID_SECRET_KEY
        value: "access-key-id"
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: S3_SECRET_ACCESS_KEY_SECRET_KEY
        value: "secret-access-key"
