{{- if .Values.rbac.ownNamespaceOnly }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "renovate-operator.fullname" . }}-cluster-templates
rules:
  - apiGroups: ["renovate-operator.mogenius.com"]
    resources: ["clusterrenovatejobtemplates"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "renovate-operator.fullname" . }}-cluster-templates
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "renovate-operator.fullname" . }}-cluster-templates
subjects:
  - kind: ServiceAccount
    name: {{ include "renovate-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
