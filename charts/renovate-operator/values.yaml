# -- override the fullname of created resources
fullnameOverride: ""

# -- number of operator replicas. Leader election is enabled automatically when > 1
replicaCount: 1

crd:
  # -- whether to install the CRD or not, set to false if you want to install the CRD separately
  install: true
  mode: hook # optional: choose between "hook" and "template" install modes
  image:
    registry: registry.k8s.io
    repository: kubectl
    tag: v1.36.3
    pullPolicy: "IfNotPresent"
    # -- imagePullSecrets for the operator pod
    imagePullSecrets: []
  securityContext:
    pod:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    container:
      capabilities:
        drop:
          - ALL
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      readOnlyRootFilesystem: true
      privileged: false
      allowPrivilegeEscalation: false

image:
  registry: ghcr.io
  repository: mogenius/renovate-operator
  # -- tag of the renovate-operator, if empty .Chart.AppVersion is used
  tag: ~
  pullPolicy: "IfNotPresent"
  # -- imagePullSecrets for the operator pod
  imagePullSecrets: []

deployment:
  # -- additional annotations for the operator deployment
  annotations: {}
  # -- additional labels for the operator deployment
  labels: {}
  # -- additional labels for the operator pods
  podLabels: {}
  # -- additional annotations for the operator pods
  podAnnotations: {}
  # -- revision history limit for the operator deployment
  revisionHistoryLimit: 10

config:
  # -- default backoff limit for renovate jobs
  defaultJobBackoffLimit: 1
  # -- default active deadline seconds for renovate jobs
  defaultJobActiveDeadlineSeconds: 1800
  # -- whether to delete successfully finished renovate jobs (will lose logs)
  deleteSuccessfulJobs: false
  # -- TTL for finished renovate jobs in seconds, -1 means they are kept forever
  jobTTLSecondsAfterFinished: -1
  # -- global limit for concurrent renovate executor jobs across all RenovateJobs (0 = unlimited)
  globalParallelismLimit: 0
  # -- map of label-key to template string, applied to every Renovate Job/Pod. Supports
  # -- {job} (RenovateJob name), {project} (project slug, empty on discovery jobs),
  # -- {jobType} ("discovery"/"executor"), {namespace}. Empty-placeholder separators are
  # -- collapsed automatically, e.g. "{jobType}-{job}-{project}" -> "discovery-myjob" when project is empty.
  podLabelTemplates: {}
  logStorage:
    # -- log store mode: "disabled" (default, no-op), "memory" (in-process), "valkey" (needs valkey enabled), or "s3" (needs s3.bucket set)
    mode: disabled
  # -- whether to forward valkey cache to renovate jobs - valkey needs to be configured
  forwardCacheToJobs: true
  # -- whether to forward S3 cache configuration to Renovate executor jobs - s3.bucket needs to be set
  forwardS3CacheToJobs: true

# -- optional sub-path the UI, API and auth endpoints are served under (e.g. "/renovate")
# -- so the operator can be co-hosted with other apps on the same hostname. Leave empty
# -- to serve from the root path. When set, it is also used as the ingress/route path and
# -- appended to auto-detected OAuth/OIDC redirect URLs. OAuth/OIDC redirect URLs registered
# -- with your identity provider must include this sub-path.
basePath: ""

ingress:
  # -- whether to enable the ingress renovate-operator
  enabled: false
  # -- the ingressclassname for the ingress, default: nginx
  ingressClassName: "nginx"
  # -- the host the ingress should listen for
  host: ~
  # -- tls configuration to be applied on the ingress
  tls: []
    # - hosts:
    #     - renovate.example.com
    #   secretName: renovate-tls
  # -- labels to place on the ingress
  labels: {}
  # -- annotations to place on the ingress
  annotations: {}

# -- HTTPRoute for the operator web ui
route:
  # -- whether to enable the HTTPRoute
  enabled: false
  # -- annotations to place on the HTTPRoute
  annotations: {}
  # -- labels to place on the HTTPRoute
  labels: {}
  # -- hostnames to place on the HTTPRoute
  hostnames: []
  # -- parentRefs to place on the HTTPRoute
  parentRefs: []
  # -- group to place on the HTTPRoute
  group: ""
  # -- kind to place on the HTTPRoute
  kind: Service
  # -- weight to place on the HTTPRoute
  weight: 1
  # -- Any custom rules you want to specify
  additionalRules: []
    # - timeouts:
    #     request: 30s
    #     backendRequest: 30s
  # -- ListenerSet for the operator web UI (Gateway API v1.3+)
  listenerset:
    # -- whether to enable the ListenerSet
    enabled: false
    # -- labels to place on the ListenerSet
    labels: {}
    # -- annotations to place on the ListenerSet
    annotations: {}
    # -- parentRef pointing to the parent Gateway (required when enabled)
    parentRef: {}
    # -- name of the listener entry
    listenerName: https
    # -- port the listener should bind to
    port: 443
    # -- protocol for the listener (HTTP, HTTPS, TLS); used to derive the auth-redirect URL scheme
    protocol: HTTPS
    # -- hostname for the listener; defaults to the first entry in route.hostnames
    hostname: ""
    tls:
      # -- whether to configure TLS on the listener
      enabled: false
      # -- TLS termination mode (Terminate or Passthrough)
      mode: Terminate
      # -- name of the TLS secret; defaults to <fullname>-tls
      secretName: ""
    # -- allowedRoutes configuration for the listener
    allowedRoutes:
      namespaces:
        from: Same
    # -- optional: fully custom listeners list; overrides all listener defaults above
    listeners: []

webhook:
  enabled: false
  # -- if set to true the ui host will be used for webhooks
  unifiedWebhookHost: false
  port: 8082
  # -- optional: override the webhook base URL (WEBHOOK_BASE_URL), e.g. when the ingress or gateway is behind a proxy.
  baseUrl: ""
  # -- optional: override the scheme (http or https) of the auto-derived webhook base URL (WEBHOOK_BASE_URL), e.g. when TLS terminates at an external load balancer or Gateway
  baseUrlScheme: ""
  ingress:
    # -- whether to enable the ingress for the webhook server
    enabled: false
    # -- the ingressclassname for the ingress, default: nginx
    ingressClassName: "nginx"
    # -- the host the ingress should lsiten for
    host: ~
    # -- tls configuration to be applied on the ingress
    tls: []
      # - hosts:
      #     - webhook.renovate.example.com
      #   secretName: webhook-renovate-tls
    # -- labels to place on the ingress
    labels: {}
    # -- annotations to place on the ingress
    annotations: {}
  # -- HTTPRoute for the webhook server
  route:
    # -- whether to enable the HTTPRoute
    enabled: false
    # -- annotations to place on the HTTPRoute
    annotations: {}
    # -- labels to place on the HTTPRoute
    labels: {}
    # -- hostnames to place on the HTTPRoute
    hostnames: []
    # -- parentRefs to place on the HTTPRoute
    parentRefs: []
    # -- group to place on the HTTPRoute
    group: ""
    # -- kind to place on the HTTPRoute
    kind: Service
    # -- weight to place on the HTTPRoute
    weight: 1
    # -- Any custom rules you want to specify
    additionalRules: []
      # - timeouts:
      #     request: 30s
      #     backendRequest: 30s
    # -- ListenerSet for the webhook server (Gateway API v1.3+)
    listenerset:
      # -- whether to enable the ListenerSet
      enabled: false
      # -- labels to place on the ListenerSet
      labels: {}
      # -- annotations to place on the ListenerSet
      annotations: {}
      # -- parentRef pointing to the parent Gateway (required when enabled)
      parentRef: {}
      # -- name of the listener entry
      listenerName: https
      # -- port the listener should bind to
      port: 443
      # -- protocol for the listener (HTTP, HTTPS, TLS)
      protocol: HTTPS
      # -- hostname for the listener; defaults to the first entry in webhook.route.hostnames
      hostname: ""
      tls:
        # -- whether to configure TLS on the listener
        enabled: false
        # -- TLS termination mode (Terminate or Passthrough)
        mode: Terminate
        # -- name of the TLS secret; defaults to <fullname>-webhook-tls
        secretName: ""
      # -- allowedRoutes configuration for the listener
      allowedRoutes:
        namespaces:
          from: Same
      # -- optional: fully custom listeners list; overrides all listener defaults above
      listeners: []

auth:
  # -- comma-separated list of default groups for RenovateJobs without explicit allowedGroups (empty = all authenticated users can see jobs without explicit group restrictions)
  defaultAllowedGroups: ""
  oidc:
    # -- whether to enable OIDC authentication for the UI
    enabled: false
    # -- OIDC issuer URL (e.g. https://accounts.google.com or https://login.microsoftonline.com/{tenant}/v2.0)
    issuerUrl: ""
    # -- OIDC client ID
    clientId: ""
    # -- name of an existing secret containing the OIDC client secret
    existingSecret: ""
    # -- key in the existing secret that contains the OIDC client secret
    secretKey: "client-secret"
    # -- optional: session encryption secret (auto-generated if empty, but sessions won't survive pod restarts)
    sessionSecretKey: ""
    # -- optional: OIDC redirect URL (auto-detected from ingress host if empty)
    redirectUrl: ""
    # -- optional: override the scheme (http or https) of the auto-detected redirect URL, e.g. when TLS terminates at an external load balancer or Gateway (ignored when redirectUrl is set)
    redirectScheme: ""
    # -- optional: skip TLS verification for the OIDC provider (not recommended for production)
    insecureSkipVerify: false
    # -- optional: OIDC end_session_endpoint URL for provider logout (auto-discovered if available)
    logoutUrl: ""
    # -- optional: only accept groups with this prefix (e.g., "renovate-")
    # -- Leave empty to accept all groups. High-security environments should set this.
    allowedGroupPrefix: ""
    # -- optional: only accept groups matching this regex pattern (e.g., "^(team-|platform-).*")
    # -- Leave empty to accept all groups. Can be combined with allowedGroupPrefix.
    allowedGroupPattern: ""
    # -- optional: name of the OIDC claim that carries group memberships (defaults to "groups")
    # -- Set this if your provider emits groups under a namespaced claim, e.g. "https://example.com/groups".
    groupsClaim: ""
    # -- optional: additional OIDC scopes to request (e.g., "groups" for Keycloak)
    additionalScopes: []
    # -- optional: fetch groups from the OIDC userinfo endpoint and merge with ID token groups (for providers that only expose groups via userinfo)
    fetchUserInfoGroups: false
    # -- optional: enable PKCE (Proof Key for Code Exchange) for the OIDC auth flow (enabled by default)
    pkceEnabled: true
    caCert:
      # -- name of an existing secret containing a PEM-encoded CA certificate to trust for OIDC TLS connections
      existingSecret: ""
      # -- key in the secret that contains the CA certificate
      key: "ca.crt"
      # -- mount path for the CA certificate inside the operator container
      mountPath: "/etc/ssl/certs/oidc-ca.crt"
  github:
    # -- whether to enable GitHub OAuth authentication for the UI (mutually exclusive with OIDC)
    enabled: false
    # -- GitHub OAuth App client ID
    clientId: ""
    # -- name of an existing secret containing the GitHub OAuth client secret
    existingSecret: ""
    # -- key in the existing secret that contains the GitHub OAuth client secret
    secretKey: "client-secret"
    # -- optional: session encryption secret (auto-generated if empty, but sessions won't survive pod restarts)
    sessionSecretKey: ""
    # -- optional: GitHub OAuth redirect URL (auto-detected from ingress host if empty)
    redirectUrl: ""
    # -- optional: override the scheme (http or https) of the auto-detected redirect URL, e.g. when TLS terminates at an external load balancer or Gateway (ignored when redirectUrl is set)
    redirectScheme: ""

rbac:
  # -- if true no clusterrole and clusterrolebinding will be created, only role and rolebinding
  # -- when enabled, the operator will only watch resources in the namespace it is deployed to
  ownNamespaceOnly: false
  # -- optional: specify a custom namespace to watch (defaults to the release namespace when ownNamespaceOnly is true)
  watchNamespace: ""

policy:
  # -- master switch for the policy engine. **Off by default** so that a new install works
  # -- straight away: you can get Renovate running first and secure the operator afterwards,
  # -- which also suits homelab and throwaway clusters. On anything shared, turn it on.
  # --
  # -- Enabling or disabling does not affect what the CRD itself rejects (hostPath volumes,
  # -- privileged containers, allowPrivilegeEscalation): those are refused by the Kubernetes
  # -- API server regardless of this setting.
  enabled: false
  # -- hostnames the operator is allowed to send to. This bounds every URL taken from a
  # -- RenovateJob: spec.provider.endpoint, spec.provider.publicEndpoint and the webhook
  # -- delivery URL written onto your repositories. A job pointing anywhere else is refused,
  # -- so the operator's credentials and your repository events cannot be redirected by
  # -- whoever can edit a RenovateJob.
  # --
  # -- Entries are bare hostnames (no scheme, port or path) and must match exactly.
  # --
  # -- The defaults cover the public platforms. You must append your own platform host,
  # -- if self-hosted (e.g. gitlab.example.com).
  # --
  # -- The operator's own webhook host is added for you: whenever the webhook server is
  # -- enabled and a base URL is configured or derivable (webhook.baseUrl, or the host of
  # -- webhook.ingress/webhook.route), that hostname is appended to this list. It comes
  # -- from these values, so it is an approved destination already. A per-job
  # -- spec.webhook.baseUrl pointing elsewhere still has to be listed here explicitly.
  # -- Set to [] to refuse every destination other than that webhook host.
  allowedHosts:
    - api.github.com
    - github.com
    - gitlab.com
    - api.bitbucket.org
    - bitbucket.org
    - gitea.com
    - codeberg.org
  # -- require a secret to opt in before a RenovateJob may have the operator read it at a
  # -- caller-chosen key. Applies to spec.webhook.sync.secretRef,
  # -- spec.webhook.authentication.secretRef and spec.githubAppReference, all of which name
  # -- both a secret and the key(s) to read. Without an opt-in, anyone who can edit a
  # -- RenovateJob could have the operator read any value in the namespace using its own
  # -- credentials. Opt a secret in by labelling it:
  # --   renovate-operator.mogenius.com/allow-ref: "true"
  # -- spec.secretRef is unaffected: it is only ever read at Renovate's own well-known token
  # -- key names, so it is not an arbitrary-key reference.
  requireSecretRefOptIn: true
  # -- ServiceAccount names a RenovateJob may run its pods as, via spec.serviceAccount.name.
  # -- Empty allows only the namespace default, i.e. jobs that leave the field unset.
  allowedServiceAccounts: []
  # -- allow a RenovateJob to run its pods as uid 0 via spec.securityContext. Off by
  # -- default; the operator's hardened defaults run as uid 12021. Note that privileged
  # -- containers, allowPrivilegeEscalation and hostPath volumes are rejected by the CRD
  # -- itself and cannot be re-enabled here.
  allowRootUser: false
  # -- container image repositories a RenovateJob may run, via spec.image. Each entry
  # -- authorises exactly the repository it names. The tag or digest on
  # -- spec.image is ignored; the repository must match verbatim.
  # --
  # -- Because the match is literal, every spelling in use has to be listed. Both Docker
  # -- Hub forms ship below, since "renovate/renovate:<tag>" is the form the docs and
  # -- most specs use. Add your own entry if you pull Renovate through an internal
  # -- registry mirror, or write it as "index.docker.io/...".
  # -- Set to [] to deny every image.
  allowedImages:
    - renovate/renovate
    - docker.io/renovate/renovate
    - ghcr.io/renovatebot/renovate

# -- security context for the pod and containers
securityContext:
  pod:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  container:
    capabilities:
      drop:
        - ALL
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    readOnlyRootFilesystem: true
    privileged: false
    allowPrivilegeEscalation: false

# -- resources for the operator pod
resources: {}
# -- extra environment variables for the operator container
extraEnv: []
# -- extra volumes to add to the operator pod (e.g. for CA certificates)
extraVolumes: []
# -- extra volume mounts to add to the operator container
extraVolumeMounts: []
# -- nodeSelector for the operator pod
nodeSelector: {}
# -- tolerations for the operator pod
tolerations: []
# -- affinity for the operator pod
affinity: {}
# -- topologySpreadConstraints for the operator pod
topologySpreadConstraints: []
# -- priorityClassName for the operator pod
priorityClassName: ""

serviceAccount:
  # -- name of the serviceaccount, if not set a name is generated using the fullname template
  name: ~
  # -- whether a serviceaccount should be created
  create: true
  # -- annotations to add to the serviceaccount
  annotations: {}
  # -- labels to add to the serviceaccount
  labels: {}

logging:
  # -- log level for the operator, one of 'debug', 'info', 'error', 'panic'or any integer value > 0
  level: "info"
  # -- log format for the operator, one of: json, console
  format: "json"

# -- optional: connection to an external redis-protocol-compatible key value store (e.g. Redis / Valkey)
# -- Takes precedence over the deprecated valkey.existingSecret and the bundled valkey instance.
# -- Active when host or existingSecret.name is set.
externalKeyValueStore:
  # -- whether the connection should be made with TLS encryption enabled (rediss://)
  useTls: false
  # -- host for the connection; alternatively provide via existingSecret.hostKey
  host: ~
  # -- port for the connection; alternatively provide via existingSecret.portKey
  port: 6379
  # -- username for authentication; alternatively provide via existingSecret.usernameKey.
  # -- Omit to authenticate as the default user.
  username: ~
  # -- secret containing connection and authentication values.
  # -- Keys win over their clear-value counterparts above.
  existingSecret:
    # -- name of the secret containing connection and authentication information
    name: ~
    # -- key containing the full connection url (e.g. "rediss://user:password@valkey:6379/0").
    # -- When set, all other keys and clear values are ignored.
    urlKey: ~
    # -- key containing the host for the connection
    hostKey: ~
    # -- key containing the port for the connection
    portKey: ~
    # -- key containing the username for authentication
    usernameKey: ~
    # -- key containing the password for authentication.
    # -- The password can only be provided via secret.
    passwordKey: ~

# -- optional: deploy a Valkey instance for session storage (recommended for multi-replica)
valkey:
  # Enable Valkey for session storage. When enabled, the operator will create a Valkey deployment and use it to store sessions.
  enabled: false

  # -- DEPRECATED: use externalKeyValueStore.existingSecret instead; will be removed in a future release.
  # -- name of an existing secret containing the Valkey URL for session storage
  # -- Use this to provide a Valkey URL (e.g., "redis://:password@valkey:6379/0") via a Kubernetes secret
  # -- When set, sessions are stored in Valkey (recommended for multi-replica deployments)
  existingSecret: ""
  # -- DEPRECATED: use externalKeyValueStore.existingSecret.urlKey instead; will be removed in a future release.
  # -- key in the existing secret that contains the Valkey URL
  existingSecretKey: "valkey-url"
  auth:
    # Enable ACL-based authentication
    # IMPORTANT: When authentication is enabled, the 'default' user MUST be defined in either
    # aclUsers or aclConfig. Without a default user, anyone can access the database without
    # credentials, creating a security risk.
    enabled: true

    # Use an existing secret for user passwords. Key defaults to username.
    usersExistingSecret: ""

    aclUsers:
      default:
        password: ""
        passwordKey: ""
        permissions: "~* &* +@all"
  dataStorage:
    enabled: false
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false

s3:
  # -- S3 bucket name; required when config.logStorage.mode=s3 or config.forwardS3CacheToJobs=true
  bucket: ""
  # -- AWS region (defaults to us-east-1)
  region: "us-east-1"
  # -- Custom S3-compatible endpoint URL for self-hosted object stores (e.g. RustFS); leave empty for AWS S3
  endpoint: ""
  # -- Enable path-style S3 addressing (required by some S3-compatible stores); leave false for AWS S3
  forcePathStyle: false
  # -- Object key prefix used by the operator log store (LOG_STORE_MODE=s3)
  logPrefix: "renovate-logs"
  # -- Object key prefix forwarded to Renovate jobs as RENOVATE_S3_URL
  cachePrefix: "renovate-cache"
  # -- Name of an existing Secret containing S3 credentials (optional; uses the pod's IAM role when absent)
  # The Secret must have keys: access-key-id and secret-access-key
  existingSecret: ""

metrics:
  enabled: false
  serviceMonitor:
    # -- whether to create a ServiceMonitor for the operator metrics
    enabled: false
    # -- scrape interval for the ServiceMonitor, defaults to Prometheus global scrape interval
    interval: ~
    labels: {}
  dashboard:
    # -- whether to create a Grafana dashboard for the operator metrics
    enabled: false
    annotations: {}
    labels:
      grafana_dashboard: "1"
    # -- namespace to create the dashboard in, defaults to the release namespace
    namespace: ~
    # -- GrafanaDashboard CR is created when metrics.dashboard.enabled is true and grafana-operator CRDs are present
    # -- all fields below are passed to the GrafanaDashboard CR spec
    grafanaDashboard:
      allowCrossNamespaceImport: false
      instanceSelector:
        matchLabels: {}

# -- list of extra manifests
extraManifests: []
  #- |
  #  apiVersion: v1
  #  data:
  #    client-secret: XXXXXXXXXXXXXXXXXXX
  #  kind: Secret
  #  metadata:
  #    name: oidc-secret
  #    namespace: renovate-operator
  #  type: Opaque

# -- OpenTelemetry configuration for the operator
telemetry:
  # -- enable OTLP export of traces, metrics, and logs from the operator
  enabled: false
  # -- OTLP gRPC endpoint for the operator (host:port format, e.g. "my-collector:4317")
  endpoint: ""
  # -- OTLP protocol for the operator. Only "grpc" is currently supported.
  protocol: "grpc"
  # -- forward OTEL_* env vars to Renovate Jobs (uses Renovate's native OTLP/HTTP exporter)
  forwardToJobs: false
  # -- OTLP/HTTP endpoint for Renovate Jobs (full URL, e.g. "http://my-collector:4318").
  # -- Defaults to telemetry.endpoint. Set this explicitly when the operator endpoint is a
  # -- gRPC host:port so that Jobs receive a proper HTTP URL for Renovate's OTLP/HTTP exporter.
  jobEndpoint: ""
